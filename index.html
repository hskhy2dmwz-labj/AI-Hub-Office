<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Office</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080d16;
      --panel: #101827;
      --panel-2: #151f31;
      --wall: #26344c;
      --text: #eef3ff;
      --muted: #8f9ab0;
      --green: #5fe0a0;
      --purple: #716cff;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      padding: 14px 12px 105px;
    }

    .topbar {
      max-width: 820px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h1 {
      font-size: 22px;
      letter-spacing: -0.6px;
    }

    .online {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #a5f0c9;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(95,224,160,.85);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .45;
        transform: scale(1.25);
      }
    }

    .map-shell {
      width: 100%;
      max-width: 820px;
      margin: auto;
      display: flex;
      justify-content: center;
    }

    .office {
      width: 100%;
      max-width: 620px;
      aspect-ratio: 0.82;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.07);
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        #0b1220;
      background-size: 18px 18px;
    }

    .room {
      position: absolute;
      background: #111a29;
      border: 2px solid var(--wall);
      border-radius: 14px;
      overflow: hidden;
      transition: .25s;
    }

    .room.active {
      border-color: var(--purple);
      box-shadow: 0 0 18px rgba(113,108,255,.2);
    }

    .room-title {
      position: absolute;
      top: 7px;
      left: 9px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .7px;
      color: #abb6ca;
    }

    .floor-detail {
      position: absolute;
      height: 9px;
      border-radius: 3px;
      background: #26344b;
      border: 1px solid #34445f;
    }

    .desk {
      position: absolute;
      width: 34px;
      height: 13px;
      background: #33435e;
      border: 1px solid #425777;
      border-radius: 3px;
    }

    .screen {
      position: absolute;
      width: 15px;
      height: 10px;
      background: #15223a;
      border: 1px solid #586c91;
      border-radius: 2px;
    }

    .room.active .screen {
      background: #6f75ff;
      box-shadow: 0 0 9px rgba(111,117,255,.8);
    }

    .coding {
      left: 34%;
      top: 3%;
      width: 32%;
      height: 16%;
    }

    .research {
      left: 3%;
      top: 25%;
      width: 27%;
      height: 18%;
    }

    .tester {
      right: 3%;
      top: 25%;
      width: 27%;
      height: 18%;
    }

    .manager {
      left: 35%;
      top: 29%;
      width: 30%;
      height: 19%;
    }

    .design {
      left: 5%;
      bottom: 16%;
      width: 27%;
      height: 18%;
    }

    .analytics {
      right: 5%;
      bottom: 16%;
      width: 27%;
      height: 18%;
    }

    .archives {
      left: 34%;
      bottom: 3%;
      width: 32%;
      height: 16%;
    }

    .hall {
      position: absolute;
      background: #131d2c;
      border: 1px solid #202e44;
    }

    .h1 {
      left: 47%;
      top: 19%;
      width: 6%;
      height: 10%;
    }

    .h2 {
      left: 30%;
      top: 32%;
      width: 5%;
      height: 6%;
    }

    .h3 {
      right: 30%;
      top: 32%;
      width: 5%;
      height: 6%;
    }

    .h4 {
      left: 47%;
      top: 48%;
      width: 6%;
      height: 17%;
    }

    .h5 {
      left: 32%;
      top: 60%;
      width: 15%;
      height: 5%;
    }

    .h6 {
      right: 32%;
      top: 60%;
      width: 15%;
      height: 5%;
    }

    .h7 {
      left: 47%;
      bottom: 19%;
      width: 6%;
      height: 7%;
    }

    .agent {
      position: absolute;
      width: 18px;
      height: 24px;
      z-index: 20;
      transition:
        left .75s linear,
        top .75s linear;
      pointer-events: none;
    }

    .agent-name {
      position: absolute;
      bottom: 27px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      font-weight: 700;
      white-space: nowrap;
      color: #eaf0ff;
      text-shadow:
        0 1px 2px #000,
        0 0 3px #000;
    }

    .head {
      position: absolute;
      left: 4px;
      top: 1px;
      width: 10px;
      height: 8px;
      border-radius: 2px;
      background: #efb06f;
      box-shadow:
        inset 0 -2px rgba(0,0,0,.12),
        0 0 0 1px rgba(0,0,0,.25);
    }

    .hair {
      position: absolute;
      left: 4px;
      top: 0;
      width: 10px;
      height: 3px;
      background: #392a21;
      border-radius: 2px 2px 0 0;
    }

    .torso {
      position: absolute;
      left: 3px;
      top: 9px;
      width: 12px;
      height: 9px;
      border-radius: 2px;
      background: #6d76ff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.3);
    }

    .arm {
      position: absolute;
      top: 10px;
      width: 3px;
      height: 8px;
      background: inherit;
    }

    .arm.left {
      left: 0;
    }

    .arm.right {
      right: 0;
    }

    .leg {
      position: absolute;
      top: 18px;
      width: 4px;
      height: 6px;
      border-radius: 0 0 1px 1px;
      background: #45516b;
    }

    .leg.left {
      left: 4px;
    }

    .leg.right {
      right: 4px;
    }

    .walking .leg.left {
      animation: legA .18s infinite alternate;
    }

    .walking .leg.right {
      animation: legB .18s infinite alternate;
    }

    @keyframes legA {
      to { transform: translateY(-2px); }
    }

    @keyframes legB {
      to { transform: translateY(2px); }
    }

    .working {
      animation: workingBob .45s infinite alternate;
    }

    @keyframes workingBob {
      to { transform: translateY(-1px); }
    }

    .calvin .torso { background: #6878ff; }
    .rico .torso { background: #42b88f; }
    .trent .torso { background: #dd6868; }
    .max .torso { background: #df5b91; }
    .axel .torso { background: #e2ae4f; }
    .adam .torso { background: #6793ba; }
    .draymond .torso { background: #9b68f7; }

    .draymond .head {
      background: #73482f;
    }

    .draymond .hair {
      background: #1c1715;
    }

    .task-status {
      position: fixed;
      bottom: 77px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--muted);
      z-index: 30;
    }

    .taskbar {
      position: fixed;
      left: 50%;
      bottom: 13px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 620px;
      height: 56px;
      padding: 6px;
      display: flex;
      gap: 6px;
      background: rgba(12,18,29,.96);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 17px;
      backdrop-filter: blur(16px);
      z-index: 30;
    }

    .taskbar input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 0 10px;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    .taskbar button {
      width: 46px;
      border: 0;
      border-radius: 12px;
      background: var(--purple);
      color: white;
      font-size: 20px;
    }

    @media (max-width: 600px) {
      .app {
        padding-left: 8px;
        padding-right: 8px;
      }

      .office {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="topbar">
      <h1>AI Office</h1>

      <div class="online">
        <span class="dot"></span>
        Online
      </div>
    </div>

    <div class="map-shell">
      <div class="office" id="office">

        <div class="hall h1"></div>
        <div class="hall h2"></div>
        <div class="hall h3"></div>
        <div class="hall h4"></div>
        <div class="hall h5"></div>
        <div class="hall h6"></div>
        <div class="hall h7"></div>

        <div class="room coding" id="coderRoom">
          <div class="room-title">CODING LAB</div>
          <div class="desk" style="left:37%;top:45%;"></div>
          <div class="screen" style="left:46%;top:32%;"></div>
        </div>

        <div class="room research" id="researchRoom">
          <div class="room-title">RESEARCH</div>
          <div class="desk" style="left:28%;top:48%;"></div>
          <div class="screen" style="left:42%;top:36%;"></div>
          <div class="floor-detail" style="left:12%;bottom:12%;width:40%;"></div>
        </div>

        <div class="room tester" id="testerRoom">
          <div class="room-title">TEST LAB</div>
          <div class="desk" style="left:45%;top:48%;"></div>
          <div class="screen" style="left:55%;top:36%;"></div>
          <div class="floor-detail" style="right:10%;bottom:12%;width:38%;"></div>
        </div>

        <div class="room manager" id="managerRoom">
          <div class="room-title">MANAGER</div>
          <div class="desk" style="left:34%;top:49%;width:42%;"></div>
          <div class="screen" style="left:46%;top:34%;"></div>
        </div>

        <div class="room design" id="designerRoom">
          <div class="room-title">DESIGN</div>
          <div class="desk" style="left:27%;top:47%;"></div>
          <div class="screen" style="left:40%;top:35%;"></div>
        </div>

        <div class="room analytics" id="analystRoom">
          <div class="room-title">ANALYTICS</div>
          <div class="desk" style="left:43%;top:47%;"></div>
          <div class="screen" style="left:54%;top:35%;"></div>
        </div>

        <div class="room archives" id="adminRoom">
          <div class="room-title">ARCHIVES</div>
          <div class="floor-detail" style="left:14%;top:38%;width:72%;"></div>
          <div class="floor-detail" style="left:14%;top:58%;width:72%;"></div>
        </div>

        <div class="agent max" id="max">
          <div class="agent-name">Max</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="agent calvin" id="calvin">
          <div class="agent-name">Calvin</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="agent rico" id="rico">
          <div class="agent-name">Rico</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="agent trent" id="trent">
          <div class="agent-name">Trent</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="agent draymond" id="draymond">
          <div class="agent-name">Draymond</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="agent axel" id="axel">
          <div class="agent-name">Axel</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="agent adam" id="adam">
          <div class="agent-name">Adam</div>
          <div class="hair"></div>
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

      </div>
    </div>
  </div>

  <div class="task-status" id="taskStatus">Max is ready</div>

  <div class="taskbar">
    <input
      id="taskInput"
      type="text"
      autocomplete="off"
      placeholder="Give Max a task..."
    />
    <button id="sendButton">↑</button>
  </div>

  <script>
    const office = document.getElementById("office");
    const taskInput = document.getElementById("taskInput");
    const sendButton = document.getElementById("sendButton");
    const taskStatus = document.getElementById("taskStatus");

    const agents = {
      max: document.getElementById("max"),
      calvin: document.getElementById("calvin"),
      rico: document.getElementById("rico"),
      trent: document.getElementById("trent"),
      draymond: document.getElementById("draymond"),
      axel: document.getElementById("axel"),
      adam: document.getElementById("adam")
    };

    const rooms = {
      manager: document.getElementById("managerRoom"),
      coder: document.getElementById("coderRoom"),
      research: document.getElementById("researchRoom"),
      tester: document.getElementById("testerRoom"),
      designer: document.getElementById("designerRoom"),
      analyst: document.getElementById("analystRoom"),
      admin: document.getElementById("adminRoom")
    };

    const agentState = {};

    const spawnPoints = {
      max: [49, 54],
      calvin: [50, 22],
      rico: [30, 46],
      trent: [67, 46],
      draymond: [32, 69],
      axel: [66, 69],
      adam: [50, 78]
    };

    const workPoints = {
      max: [49, 38],
      calvin: [49, 10],
      rico: [15, 33],
      trent: [82, 33],
      draymond: [17, 76],
      axel: [80, 76],
      adam: [49, 90]
    };

    const wanderZones = {
      max: [
        [43,51],[49,55],[56,52],[49,62]
      ],
      calvin: [
        [45,22],[51,22],[49,26],[42,25]
      ],
      rico: [
        [28,47],[35,50],[26,56],[37,57]
      ],
      trent: [
        [65,47],[72,50],[62,56],[74,57]
      ],
      draymond: [
        [28,67],[35,68],[29,63],[39,62]
      ],
      axel: [
        [64,67],[71,68],[61,62],[74,63]
      ],
      adam: [
        [45,80],[52,79],[49,74],[56,81]
      ]
    };

    function placeAgent(name, point) {
      const agent = agents[name];
      agent.style.left = point[0] + "%";
      agent.style.top = point[1] + "%";
    }

    Object.keys(agents).forEach(name => {
      agentState[name] = {
        busy: false,
        timer: null
      };

      placeAgent(name, spawnPoints[name]);
    });

    function randomFrom(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function wander(name) {
      if (agentState[name].busy) return;

      const agent = agents[name];
      const point = randomFrom(wanderZones[name]);

      agent.classList.add("walking");
      placeAgent(name, point);

      setTimeout(() => {
        if (!agentState[name].busy) {
          agent.classList.remove("walking");
        }
      }, 800);

      const nextDelay = 1100 + Math.random() * 1900;

      agentState[name].timer = setTimeout(() => {
        wander(name);
      }, nextDelay);
    }

    Object.keys(agents).forEach(name => {
      setTimeout(() => wander(name), Math.random() * 1200);
    });

    function stopWandering(name) {
      clearTimeout(agentState[name].timer);
      agentState[name].busy = true;
    }

    function sendToWork(name, roomName) {
      stopWandering(name);

      const agent = agents[name];
      const room = rooms[roomName];

      room.classList.add("active");
      agent.classList.add("walking");

      placeAgent(name, workPoints[name]);

      setTimeout(() => {
        agent.classList.remove("walking");
        agent.classList.add("working");
      }, 800);
    }

    function resetAgents() {
      Object.keys(agents).forEach(name => {
        clearTimeout(agentState[name].timer);
        agentState[name].busy = false;
        agents[name].classList.remove("walking", "working");
      });

      Object.values(rooms).forEach(room => {
        room.classList.remove("active");
      });
    }

    function resumeWandering() {
      Object.keys(agents).forEach(name => {
        agentState[name].busy = false;
        agents[name].classList.remove("working");
        wander(name);
      });
    }

    function runVisualTask() {
      const task = taskInput.value.trim();

      if (!task) {
        taskStatus.textContent = "Give Max a task first";
        return;
      }

      resetAgents();

      taskStatus.textContent = "Max is planning...";
      sendToWork("max", "manager");

      setTimeout(() => {
        taskStatus.textContent = "Max has assigned the team";

        sendToWork("calvin", "coder");
        sendToWork("rico", "research");
        sendToWork("trent", "tester");
        sendToWork("draymond", "designer");
        sendToWork("axel", "analyst");
        sendToWork("adam", "admin");
      }, 700);

      setTimeout(() => {
        taskStatus.textContent = "Team working...";
      }, 1500);

      setTimeout(() => {
        Object.values(rooms).forEach(room => {
          room.classList.remove("active");
        });

        taskStatus.textContent = "Team ready";
        resumeWandering();
      }, 6500);
    }

    sendButton.addEventListener("click", runVisualTask);

    taskInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        runVisualTask();
      }
    });
  </script>
</body>
</html>
