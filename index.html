<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Office</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0e16;
      color: #fff;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      padding: 16px 14px 110px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 12px;
    }

    .topbar h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #8de9bd;
      border: 1px solid rgba(93, 220, 160, 0.2);
      background: rgba(93, 220, 160, 0.07);
      border-radius: 999px;
      padding: 7px 10px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #55d89d;
      box-shadow: 0 0 10px rgba(85, 216, 157, 0.8);
      animation: pulse 1.7s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .office-wrap {
      max-width: 900px;
      margin: auto;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .office {
      position: relative;
      width: 760px;
      height: 700px;
      margin: 0 auto;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        #0d1320;
      background-size: 24px 24px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }

    .room {
      position: absolute;
      border: 2px solid #243149;
      background: #111a29;
      border-radius: 18px;
      padding: 10px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .room h3 {
      font-size: 12px;
      color: #cfd6e5;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    .desk {
      height: 34px;
      border-radius: 8px;
      background: #25334b;
      border: 1px solid #354762;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .room.active {
      border-color: #6176ff;
      box-shadow: 0 0 25px rgba(97,118,255,0.16);
    }

    .room.active .desk {
      animation: screenGlow 0.8s infinite alternate;
    }

    @keyframes screenGlow {
      from { box-shadow: inset 0 0 0 rgba(0,0,0,0); }
      to { box-shadow: inset 0 0 18px rgba(100,120,255,0.22); }
    }

    .coder-room {
      left: 275px;
      top: 25px;
      width: 210px;
      height: 120px;
    }

    .research-room {
      left: 25px;
      top: 180px;
      width: 190px;
      height: 140px;
    }

    .tester-room {
      right: 25px;
      top: 180px;
      width: 190px;
      height: 140px;
    }

    .manager-room {
      left: 275px;
      top: 235px;
      width: 210px;
      height: 145px;
    }

    .designer-room {
      left: 45px;
      bottom: 70px;
      width: 185px;
      height: 130px;
    }

    .analyst-room {
      right: 45px;
      bottom: 70px;
      width: 185px;
      height: 130px;
    }

    .admin-room {
      left: 275px;
      bottom: 35px;
      width: 210px;
      height: 125px;
    }

    .corridor {
      position: absolute;
      background: #141d2c;
      border: 1px solid #202d42;
    }

    .c1 {
      left: 365px;
      top: 145px;
      width: 30px;
      height: 90px;
    }

    .c2 {
      left: 215px;
      top: 260px;
      width: 60px;
      height: 30px;
    }

    .c3 {
      left: 485px;
      top: 260px;
      width: 60px;
      height: 30px;
    }

    .c4 {
      left: 365px;
      top: 380px;
      width: 30px;
      height: 125px;
    }

    .c5 {
      left: 230px;
      top: 475px;
      width: 135px;
      height: 30px;
    }

    .c6 {
      left: 395px;
      top: 475px;
      width: 135px;
      height: 30px;
    }

    .agent {
      position: absolute;
      width: 34px;
      height: 46px;
      z-index: 5;
      transition:
        left 1s ease,
        top 1s ease,
        transform 0.3s ease;
    }

    .head {
      width: 24px;
      height: 20px;
      margin: 0 auto;
      border-radius: 6px 6px 4px 4px;
      background: #f0b27a;
      border: 2px solid rgba(0,0,0,0.2);
    }

    .body {
      width: 26px;
      height: 22px;
      margin: -1px auto 0;
      border-radius: 5px 5px 7px 7px;
      background: #6677ff;
      border: 2px solid rgba(0,0,0,0.2);
    }

    .legs {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: -1px;
    }

    .leg {
      width: 7px;
      height: 8px;
      background: #34405a;
      border-radius: 0 0 3px 3px;
    }

    .name {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      white-space: nowrap;
      color: #c9d2e2;
      background: rgba(5,8,13,0.7);
      padding: 2px 5px;
      border-radius: 5px;
    }

    .walking {
      animation: bob 0.35s infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    .working .body {
      animation: workFlash 0.55s infinite alternate;
    }

    @keyframes workFlash {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }

    .draymond .head {
      background: #6f432d;
    }

    .calvin .body { background: #5f75ff; }
    .rico .body { background: #3cae8d; }
    .trent .body { background: #d26c6c; }
    .draymond .body { background: #a66cff; }
    .axel .body { background: #e0a84f; }
    .adam .body { background: #6a93b9; }
    .max .body { background: #e05f88; }

    .taskbar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 760px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(14,20,32,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      z-index: 20;
    }

    .taskbar input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 14px;
    }

    .taskbar button {
      width: 48px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(145deg, #6b79ff, #7658e8);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .status-text {
      position: fixed;
      left: 50%;
      bottom: 79px;
      transform: translateX(-50%);
      color: #7f8da6;
      font-size: 10px;
      z-index: 20;
    }

    @media (max-width: 820px) {
      .office-wrap {
        margin-left: -6px;
        margin-right: -6px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="topbar">
      <h1>AI Office</h1>

      <div class="online">
        <span class="online-dot"></span>
        Online
      </div>
    </div>

    <div class="office-wrap">
      <div class="office">

        <div class="corridor c1"></div>
        <div class="corridor c2"></div>
        <div class="corridor c3"></div>
        <div class="corridor c4"></div>
        <div class="corridor c5"></div>
        <div class="corridor c6"></div>

        <div class="room coder-room" id="coderRoom">
          <h3>CODING LAB</h3>
          <div class="desk">💻</div>
        </div>

        <div class="room research-room" id="researchRoom">
          <h3>RESEARCH</h3>
          <div class="desk">🔎</div>
        </div>

        <div class="room tester-room" id="testerRoom">
          <h3>TEST LAB</h3>
          <div class="desk">🧪</div>
        </div>

        <div class="room manager-room" id="managerRoom">
          <h3>MANAGER</h3>
          <div class="desk">🧠</div>
        </div>

        <div class="room designer-room" id="designerRoom">
          <h3>DESIGN</h3>
          <div class="desk">🎨</div>
        </div>

        <div class="room analyst-room" id="analystRoom">
          <h3>ANALYTICS</h3>
          <div class="desk">📊</div>
        </div>

        <div class="room admin-room" id="adminRoom">
          <h3>ARCHIVES</h3>
          <div class="desk">🗂️</div>
        </div>

        <div class="agent max" id="max" style="left:365px; top:410px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Max</div>
        </div>

        <div class="agent calvin" id="calvin" style="left:330px; top:155px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Calvin</div>
        </div>

        <div class="agent rico" id="rico" style="left:225px; top:335px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Rico</div>
        </div>

        <div class="agent trent" id="trent" style="left:505px; top:335px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Trent</div>
        </div>

        <div class="agent draymond" id="draymond" style="left:240px; top:520px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Draymond</div>
        </div>

        <div class="agent axel" id="axel" style="left:485px; top:520px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Axel</div>
        </div>

        <div class="agent adam" id="adam" style="left:365px; top:555px;">
          <div class="head"></div>
          <div class="body"></div>
          <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
          </div>
          <div class="name">Adam</div>
        </div>

      </div>
    </div>
  </div>

  <div class="status-text" id="statusText">Max is ready</div>

  <div class="taskbar">
    <input id="taskInput" type="text" placeholder="Give Max a task..." />
    <button id="sendBtn">↑</button>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("statusText");

    const agents = {
      max: document.getElementById("max"),
      calvin: document.getElementById("calvin"),
      rico: document.getElementById("rico"),
      trent: document.getElementById("trent"),
      draymond: document.getElementById("draymond"),
      axel: document.getElementById("axel"),
      adam: document.getElementById("adam")
    };

    const rooms = {
      manager: document.getElementById("managerRoom"),
      coder: document.getElementById("coderRoom"),
      research: document.getElementById("researchRoom"),
      tester: document.getElementById("testerRoom"),
      designer: document.getElementById("designerRoom"),
      analyst: document.getElementById("analystRoom"),
      admin: document.getElementById("adminRoom")
    };

    const workPositions = {
      max: { left: 363, top: 295 },
      calvin: { left: 363, top: 72 },
      rico: { left: 100, top: 240 },
      trent: { left: 625, top: 240 },
      draymond: { left: 118, top: 570 },
      axel: { left: 600, top: 570 },
      adam: { left: 363, top: 620 }
    };

    function moveAgent(agent, position) {
      agent.classList.add("walking");
      agent.style.left = position.left + "px";
      agent.style.top = position.top + "px";

      setTimeout(() => {
        agent.classList.remove("walking");
        agent.classList.add("working");
      }, 1000);
    }

    function activateRoom(room) {
      room.classList.add("active");
    }

    function resetOffice() {
      Object.values(rooms).forEach(room => room.classList.remove("active"));
      Object.values(agents).forEach(agent => agent.classList.remove("working"));
    }

    sendBtn.addEventListener("click", () => {
      const task = taskInput.value.trim();

      if (!task) {
        statusText.textContent = "Type a task first";
        return;
      }

      resetOffice();

      statusText.textContent = "Max is planning the job...";

      activateRoom(rooms.manager);
      moveAgent(agents.max, workPositions.max);

      setTimeout(() => {
        statusText.textContent = "Team is working...";

        activateRoom(rooms.coder);
        activateRoom(rooms.research);
        activateRoom(rooms.tester);
        activateRoom(rooms.designer);
        activateRoom(rooms.analyst);
        activateRoom(rooms.admin);

        moveAgent(agents.calvin, workPositions.calvin);
        moveAgent(agents.rico, workPositions.rico);
        moveAgent(agents.trent, workPositions.trent);
        moveAgent(agents.draymond, workPositions.draymond);
        moveAgent(agents.axel, workPositions.axel);
        moveAgent(agents.adam, workPositions.adam);

      }, 400);
    });

    taskInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
