<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Office</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070b12;
  --floor:#0c1420;
  --room:#111b2a;
  --room2:#152133;
  --wall:#293a55;
  --wall2:#354967;
  --text:#edf3ff;
  --muted:#8b99b0;
  --green:#5ee0a5;
  --purple:#726cff;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding:14px 8px 110px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:650px;
  margin:0 auto 10px;
  padding:0 5px;
}

.topbar h1{
  font-size:22px;
  letter-spacing:-.6px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  color:#9cebc5;
  font-size:12px;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(94,224,165,.85);
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  50%{
    opacity:.45;
    transform:scale(1.3);
  }
}

.map-wrap{
  display:flex;
  justify-content:center;
  width:100%;
}

.office{
  position:relative;
  width:100%;
  max-width:620px;
  aspect-ratio:.84;
  overflow:hidden;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.07);
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    #09111d;
  background-size:16px 16px;
}

/* ROOMS */

.room{
  position:absolute;
  background:var(--room);
  border:2px solid var(--wall);
  border-radius:11px;
  overflow:hidden;
  transition:.25s;
}

.room.active{
  border-color:var(--purple);
  box-shadow:0 0 18px rgba(114,108,255,.2);
}

.room-title{
  position:absolute;
  left:7px;
  top:5px;
  font-size:6px;
  font-weight:900;
  color:#adbbd0;
  letter-spacing:.7px;
}

/* MAP */

.coding{
  left:34%;
  top:3%;
  width:32%;
  height:15%;
}

.research{
  left:3%;
  top:25%;
  width:25%;
  height:18%;
}

.manager{
  left:36%;
  top:27%;
  width:28%;
  height:18%;
}

.testing{
  right:3%;
  top:25%;
  width:25%;
  height:18%;
}

.design{
  left:3%;
  top:57%;
  width:25%;
  height:18%;
}

.analytics{
  right:3%;
  top:57%;
  width:25%;
  height:18%;
}

.archives{
  left:36%;
  bottom:3%;
  width:28%;
  height:16%;
}

.canteen{
  left:34%;
  top:51%;
  width:32%;
  height:16%;
}

/* CORRIDORS */

.corridor{
  position:absolute;
  background:#121d2c;
  border:1px solid #223149;
}

.vertical-top{
  left:47%;
  top:18%;
  width:6%;
  height:9%;
}

.left-upper{
  left:28%;
  top:32%;
  width:8%;
  height:5%;
}

.right-upper{
  right:28%;
  top:32%;
  width:8%;
  height:5%;
}

.vertical-middle{
  left:47%;
  top:45%;
  width:6%;
  height:6%;
}

.left-lower{
  left:28%;
  top:62%;
  width:6%;
  height:5%;
}

.right-lower{
  right:28%;
  top:62%;
  width:6%;
  height:5%;
}

.vertical-bottom{
  left:47%;
  top:67%;
  width:6%;
  height:14%;
}

/* DECOR */

.desk{
  position:absolute;
  width:28px;
  height:10px;
  border-radius:2px;
  background:#354861;
  border:1px solid #526985;
}

.screen{
  position:absolute;
  width:11px;
  height:8px;
  border-radius:2px;
  background:#10223d;
  border:1px solid #60789a;
}

.room.active .screen{
  background:#7279ff;
  box-shadow:0 0 8px rgba(114,121,255,.9);
}

.chair{
  position:absolute;
  width:9px;
  height:9px;
  border-radius:3px;
  background:#26354b;
  border:1px solid #3c4e69;
}

.plant{
  position:absolute;
  width:9px;
  height:12px;
}

.plant::before{
  content:"";
  position:absolute;
  width:9px;
  height:7px;
  top:0;
  border-radius:50%;
  background:#3d9c72;
  box-shadow:
    -3px 2px #397f63,
    3px 2px #4eaa7e;
}

.plant::after{
  content:"";
  position:absolute;
  bottom:0;
  left:2px;
  width:6px;
  height:5px;
  background:#87613f;
  border-radius:1px;
}

.rug{
  position:absolute;
  border-radius:4px;
  background:#1d2941;
  border:1px solid #293b59;
}

.shelf{
  position:absolute;
  width:11px;
  height:35px;
  background:#4b3b34;
  border:1px solid #665046;
}

.shelf::before{
  content:"";
  position:absolute;
  left:2px;
  top:5px;
  width:7px;
  height:3px;
  background:#7688b0;
  box-shadow:
    0 7px #c48e5c,
    0 14px #6e9b76,
    0 21px #9f71aa;
}

.server{
  position:absolute;
  width:11px;
  height:30px;
  background:#202c3f;
  border:1px solid #43536e;
  border-radius:2px;
}

.server::after{
  content:"";
  position:absolute;
  left:3px;
  top:5px;
  width:2px;
  height:2px;
  background:#65e69c;
  box-shadow:
    4px 0 #6f8cff,
    0 6px #65e69c,
    4px 6px #ffca67,
    0 12px #6f8cff,
    4px 12px #65e69c,
    0 18px #ffca67;
}

.whiteboard{
  position:absolute;
  width:34px;
  height:14px;
  border:1px solid #8292ab;
  background:#d9e0e8;
  border-radius:2px;
}

.whiteboard::after{
  content:"↗  +  ?";
  position:absolute;
  font-size:4px;
  color:#526175;
  left:5px;
  top:4px;
}

.coffee{
  position:absolute;
  width:12px;
  height:13px;
  background:#4a596b;
  border-radius:2px;
  border:1px solid #6c7c90;
}

.coffee::after{
  content:"";
  position:absolute;
  width:4px;
  height:5px;
  background:#d5d9df;
  left:4px;
  bottom:1px;
}

.vending{
  position:absolute;
  width:15px;
  height:31px;
  border-radius:2px;
  background:#32445c;
  border:1px solid #5b7191;
}

.vending::before{
  content:"";
  position:absolute;
  left:3px;
  top:4px;
  width:9px;
  height:15px;
  background:
    linear-gradient(
      #d36d6d 0 20%,
      #6fa8e2 20% 40%,
      #64be8f 40% 60%,
      #d9b85e 60% 80%,
      #9b79d5 80%
    );
}

.sofa{
  position:absolute;
  width:31px;
  height:13px;
  background:#384766;
  border:1px solid #566988;
  border-radius:5px;
}

.table{
  position:absolute;
  width:18px;
  height:12px;
  border-radius:50%;
  background:#665143;
  border:1px solid #806856;
}

.fridge{
  position:absolute;
  width:13px;
  height:27px;
  background:#69798d;
  border:1px solid #8798ad;
  border-radius:2px;
}

.fridge::after{
  content:"";
  position:absolute;
  width:2px;
  height:7px;
  background:#303c4a;
  right:2px;
  top:4px;
}

.filecabinet{
  position:absolute;
  width:12px;
  height:25px;
  background:#3d4d62;
  border:1px solid #5c708a;
}

.filecabinet::before{
  content:"";
  position:absolute;
  width:6px;
  height:1px;
  background:#9daabc;
  left:2px;
  top:6px;
  box-shadow:0 7px #9daabc,0 14px #9daabc;
}

/* CHARACTERS */

.agent{
  position:absolute;
  width:13px;
  height:18px;
  z-index:50;
  pointer-events:none;
  transition:left .55s linear,top .55s linear;
}

.agent-name{
  position:absolute;
  bottom:21px;
  left:50%;
  transform:translateX(-50%);
  font-size:5px;
  font-weight:800;
  white-space:nowrap;
  color:white;
  text-shadow:
    0 1px 2px #000,
    0 0 4px #000;
}

.head{
  position:absolute;
  left:3px;
  top:2px;
  width:7px;
  height:6px;
  border-radius:2px;
  background:#ecad71;
}

.hair{
  position:absolute;
  left:3px;
  top:0;
  width:7px;
  height:3px;
  background:#322720;
  z-index:2;
  border-radius:2px 2px 0 0;
}

.body{
  position:absolute;
  left:2px;
  top:8px;
  width:9px;
  height:7px;
  border-radius:2px;
  background:#6978ff;
}

.leg{
  position:absolute;
  width:3px;
  height:4px;
  top:14px;
  background:#3f4c64;
}

.leg.left{
  left:3px;
}

.leg.right{
  right:3px;
}

.walking .leg.left{
  animation:leg1 .18s alternate infinite;
}

.walking .leg.right{
  animation:leg2 .18s alternate infinite;
}

@keyframes leg1{
  to{transform:translateY(-1.5px)}
}

@keyframes leg2{
  to{transform:translateY(1.5px)}
}

.working{
  animation:work .45s alternate infinite;
}

@keyframes work{
  to{transform:translateY(-1px)}
}

/* PERSON STYLES */

.max .body{
  background:#e05a8d;
}

.max .hair{
  background:#32251f;
  border-radius:4px 4px 1px 1px;
}

.calvin .body{
  background:#6178ff;
}

.calvin .hair{
  background:#442f22;
  height:2px;
}

.rico .body{
  background:#3fb38b;
}

.rico .hair{
  background:#161b20;
  border-radius:5px 5px 1px 1px;
}

.trent .body{
  background:#df6868;
}

.trent .hair{
  background:#d2a05a;
  height:3px;
}

.draymond .head{
  background:#744b34;
}

.draymond .body{
  background:#9d65f6;
}

.draymond .hair{
  background:#151414;
  height:3px;
}

.axel .body{
  background:#dda947;
}

.axel .hair{
  background:#c78644;
}

.adam .body{
  background:#6294bd;
}

.adam .hair{
  background:#3f332a;
}

/* STATUS */

.task-status{
  position:fixed;
  left:50%;
  bottom:77px;
  transform:translateX(-50%);
  color:var(--muted);
  font-size:10px;
  z-index:100;
}

.taskbar{
  position:fixed;
  left:50%;
  bottom:13px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:620px;
  height:56px;
  padding:6px;
  display:flex;
  gap:6px;
  background:rgba(11,16,26,.96);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  backdrop-filter:blur(16px);
  z-index:100;
}

.taskbar input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:14px;
  padding:0 10px;
}

.taskbar button{
  width:46px;
  border:0;
  border-radius:12px;
  background:#7067ef;
  color:white;
  font-size:20px;
}

@media(max-width:600px){
  .office{
    width:100%;
  }
}
</style>
</head>

<script>

const agents = {
  max: document.getElementById("max"),
  calvin: document.getElementById("calvin"),
  rico: document.getElementById("rico"),
  trent: document.getElementById("trent"),
  draymond: document.getElementById("draymond"),
  axel: document.getElementById("axel"),
  adam: document.getElementById("adam")
};

const rooms = {
  max: document.getElementById("managerRoom"),
  calvin: document.getElementById("coderRoom"),
  rico: document.getElementById("researchRoom"),
  trent: document.getElementById("testerRoom"),
  draymond: document.getElementById("designerRoom"),
  axel: document.getElementById("analystRoom"),
  adam: document.getElementById("adminRoom")
};

const taskInput = document.getElementById("taskInput");
const sendButton = document.getElementById("sendButton");
const taskStatus = document.getElementById("taskStatus");

/*
Every point below is a legal place to stand.

Characters ONLY travel between connected points.
This prevents them cutting straight through rooms/walls.
*/

const nodes = {

  codingDoor:[50,20],
  codingDesk:[50,12],

  topHall:[50,23],

  researchDoor:[30,34],
  researchDesk:[17,34],

  managerDoorTop:[50,27],
  managerDesk:[50,37],

  testDoor:[70,34],
  testDesk:[83,34],

  middleHall:[50,48],

  canteenDoor:[50,51],
  canteenCentre:[50,58],
  canteenCoffee:[39,58],
  canteenTable:[55,60],
  canteenSofa:[61,63],

  designDoor:[30,64],
  designDesk:[17,65],

  analyticsDoor:[70,64],
  analyticsDesk:[83,65],

  bottomHall:[50,72],

  archivesDoor:[50,81],
  archivesDesk:[50,89],

  hallLeft:[36,48],
  hallRight:[64,48],

  hallLeftLower:[33,64],
  hallRightLower:[67,64]
};


/*
Allowed connections.

No diagonal teleporting.
No walking through walls.
*/

const links = {

  codingDoor:["codingDesk","topHall"],
  codingDesk:["codingDoor"],

  topHall:[
    "codingDoor",
    "managerDoorTop"
  ],

  managerDoorTop:[
    "topHall",
    "managerDesk",
    "middleHall",
    "researchDoor",
    "testDoor"
  ],

/*
Find shortest legal route using BFS.
*/

function findPath(start,end){

  if(start===end){
    return [start];
  }

  const queue=[[start]];

  const visited=new Set([start]);

  while(queue.length){

    const path=queue.shift();

    const current=path[path.length-1];

    const neighbours=links[current] || [];

    for(const next of neighbours){

      if(visited.has(next)){
        continue;
      }

      const nextPath=[...path,next];

      if(next===end){
        return nextPath;
      }

      visited.add(next);

      queue.push(nextPath);

    }

  }

  return [start];

}


function setPosition(name,nodeName){

  const agent=agents[name];

  const point=nodes[nodeName];

  agent.style.left=point[0]+"%";
  agent.style.top=point[1]+"%";

}


Object.keys(state).forEach(name=>{

  setPosition(name,state[name].node);

});


function delay(ms){

  return new Promise(resolve=>setTimeout(resolve,ms));

}


/*
Walk one character along legal route.
*/

async function walkTo(name,destination){

  if(state[name].moving){
    return;
  }

  state[name].moving=true;

  const agent=agents[name];

  const path=findPath(
    state[name].node,
    destination
  );

  agent.classList.add("walking");

  for(let i=1;i<path.length;i++){

    if(state[name].busy && state[name].cancelIdle){
      break;
    }

    const node=path[i];

    setPosition(name,node);

    await delay(600);

    state[name].node=node;

  }

  agent.classList.remove("walking");

  state[name].moving=false;

}


/*
Idle behaviour.

Characters DO NOT wander constantly.

They spend most of the time standing/sitting somewhere,
then occasionally decide to move.
*/

async function idleRoutine(name){

  while(true){

    const waitTime=
      5000 +
      Math.random()*10000;

    await delay(waitTime);

    if(state[name].busy){
      continue;
    }

    if(Math.random()<0.48){
      continue;
    }

    let destination;

    const roll=Math.random();

    /*
    Sometimes go to canteen.
    */

    if(roll<0.42){

      const canteenChoices=[
        "canteenCoffee",
        "canteenTable",
        "canteenSofa"
      ];

      destination=
        canteenChoices[
          Math.floor(
            Math.random()*canteenChoices.length
          )
        ];

    }

    else{

      destination=
        idleDestinations[
          Math.floor(
            Math.random()*idleDestinations.length
          )
        ];

    }

    await walkTo(name,destination);

    /*
    Stay there for a while.
    */

    await delay(
      5000 +
      Math.random()*9000
    );

  }

}


Object.keys(state).forEach(name=>{

  idleRoutine(name);

});

async function sendAgentToWork(name){

  state[name].busy=true;

  while(state[name].moving){

    await delay(100);

  }

  state[name].cancelIdle=false;

  await walkTo(
    name,
    workDestination[name]
  );

  agents[name].classList.add("working");

  rooms[name].classList.add("active");

}

  });

  taskStatus.textContent=

}
