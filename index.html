<title>AI Office</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --void:#000307;
  --wall:#34485f;
  --wall-hi:#506883;
  --line:#26384d;
  --text:#f1f6ff;
  --muted:#8d9aaf;
  --purple:#7268ff;
  --green:#55dda0;
}

html,body{
  background:var(--void);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100%;
}

body{
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding:16px 8px 115px;
}

.top{
  width:min(100%,650px);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:5px 7px 12px;
}

.title{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.6px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  color:#98e8c2;
  font-size:12px;
}

.online i{
  display:block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 9px rgba(85,221,160,.7);
}

.map-holder{
  display:flex;
  justify-content:center;
  width:100%;
}

.office{
  position:relative;
  width:100%;
  max-width:630px;
  height:790px;
}

/* =====================================================
   SHARED BUILDING STYLES
===================================================== */

.room,
.corridor{
  position:absolute;
}

.room{
  border:3px solid var(--wall);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.03),
    0 0 0 1px #09101a;
  overflow:hidden;
}

.room:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:16px 16px;
}

.room.active{
  border-color:#736cff;
  box-shadow:
    0 0 16px rgba(115,108,255,.25),
    inset 0 0 18px rgba(115,108,255,.08);
}

.label{
  position:absolute;
  top:6px;
  left:8px;
  z-index:4;
  font-size:6px;
  font-weight:900;
  letter-spacing:1px;
  color:#d1dbeb;
  text-shadow:0 1px #000;
}

.corridor{
  background:
    repeating-linear-gradient(
      90deg,
      #182333 0 13px,
      #1d2a3b 13px 26px
    );
  border:2px solid var(--wall);
  z-index:1;
}

.door{
  position:absolute;
  background:#80583d;
  border:1px solid #b07a51;
  z-index:8;
}

.door.vertical{
  width:7px;
  height:24px;
}

.door.horizontal{
  width:24px;
  height:7px;
}

/* =====================================================
   ASYMMETRICAL FLOORPLAN
===================================================== */

.research{
  left:2%;
  top:7%;
  width:32%;
  height:27%;

}

.manager{
  left:38%;
  top:2%;

  height:24%;

    linear-gradient(rgba(111,70,44,.12),rgba(111,70,44,.12)),

.testing{
  right:1%;

}

.utility{

  top:81%;

  height:14%;

}

.archives{

.restroom{

/* =====================================================
   FURNITURE
===================================================== */

.desk{
  position:absolute;
  width:31px;
  height:13px;
  border-radius:2px;
  background:#58677a;
  border:1px solid #8292a6;
  box-shadow:0 2px rgba(0,0,0,.35);
}

.woodDesk{
  background:#76523d;
  border-color:#9a7056;
}

.monitor{
  position:absolute;
  width:13px;
  height:10px;
  background:#10243c;
  border:1px solid #7890ad;
  border-radius:2px;
}

.monitor:after{
  content:"";
  position:absolute;
  left:2px;
  right:2px;
  top:3px;
  height:2px;
  background:#55b3ff;
  box-shadow:0 3px #886fff;
}

.chair{
  position:absolute;
  width:9px;
  height:9px;
  background:#374961;
  border:1px solid #60748f;

}

.server{
  position:absolute;
  width:13px;
  height:39px;
  background:#162433;
  border:1px solid #60758d;
}

.server:after{
  content:"";
  position:absolute;
  width:3px;
  height:3px;
  left:2px;
  top:5px;
  background:#52e099;
  box-shadow:
    5px 0 #6e88ff,
    0 6px #dfa94c,
    5px 6px #52e099,
    0 12px #7691ff,
    5px 12px #e56a6a,
    0 18px #52e099,
    5px 18px #dfa94c,
    0 24px #7691ff,
    5px 24px #52e099;
}

.shelf{
  position:absolute;
  width:15px;
  height:45px;
  background:#594338;
  border:1px solid #846554;
}

.shelf:after{
  content:"";
  position:absolute;
  left:2px;
  top:5px;
  width:10px;
  height:5px;
  background:#c19062;
  box-shadow:
    0 8px #7592bf,
    0 16px #75a87e,
    0 24px #b57ca7,
    0 32px #d2aa63;
}

.board{
  position:absolute;
  width:39px;
  height:20px;
  background:#d9e3eb;
  border:2px solid #8999aa;
}

.board:after{
  content:"";
  position:absolute;
  left:5px;
  top:5px;
  width:20px;
  height:2px;
  background:#e06464;
  box-shadow:
    3px 4px #4d78b1,
    0 8px #4f956b;
}

.plant{
  position:absolute;
  width:14px;
  height:20px;
}

.plant:before{
  content:"";
  position:absolute;
  width:9px;
  height:11px;
  left:2px;
  top:0;
  background:#42a873;
  border-radius:60% 40% 60% 40%;
  box-shadow:
    -4px 3px #39875e,
    5px 2px #55ba82,
    0 -3px #42996a;
}

.plant:after{
  content:"";
  position:absolute;
  width:8px;
  height:7px;
  left:3px;
  bottom:0;
  background:#966143;
  border-radius:1px 1px 3px 3px;
}

.cabinet{
  position:absolute;
  width:14px;
  height:35px;
  background:#586779;
  border:1px solid #8090a3;
}

.cabinet:after{
  content:"";
  position:absolute;
  left:2px;
  top:7px;
  width:8px;
  height:1px;
  background:#bbc5cf;
  box-shadow:
    0 9px #bbc5cf,
    0 18px #bbc5cf;
}

.box{
  position:absolute;
  width:14px;
  height:11px;
  background:#886243;
  border:1px solid #b48257;
}

.paper{
  position:absolute;
  width:9px;
  height:7px;
  background:#e3dfd0;
  transform:rotate(-12deg);
  border:1px solid #9d9a8f;
}

.cup{
  position:absolute;
  width:5px;
  height:6px;
  background:#d6dce5;
  border-radius:1px;
}

.poster{
  position:absolute;
  width:14px;
  height:19px;
  background:#33507c;
  border:1px solid #7089ac;
}

.poster:after{
  content:"★";
  font-size:7px;
  position:absolute;
  left:3px;
  top:2px;
  color:#dce9ff;
}

.vending{
  position:absolute;
  width:18px;
  height:38px;
  background:#354a63;
  border:2px solid #69829d;
}

.vending:after{
  content:"";
  position:absolute;
  left:3px;
  top:4px;
  width:9px;
  height:20px;
  background:
    linear-gradient(
      #eb6674 0 20%,
      #6c8cef 20% 40%,
      #61c58c 40% 60%,
      #e9bb59 60% 80%,
      #a36fd6 80%
    );
}

.fridge{
  position:absolute;
  width:17px;
  height:36px;
  background:#9aa5b0;
  border:2px solid #c2cad1;
}

.fridge:after{
  content:"";
  position:absolute;
  top:16px;
  left:1px;
  right:1px;
  height:1px;
  background:#636f79;
}

.tableRound{
  position:absolute;
  width:24px;
  height:17px;
  background:#8a6248;
  border:2px solid #b0815e;
  border-radius:50%;
}

.sofa{
  position:absolute;
  width:38px;
  height:15px;
  background:#53637b;
  border:2px solid #72859f;
  border-radius:6px;
}

.pipe{
  position:absolute;
  background:#5a6269;
  border:1px solid #7d878f;
}

.bin{
  position:absolute;
  width:8px;
  height:10px;
  background:#344352;
  border:1px solid #5f6d79;
}

.rug{
  position:absolute;
  border:2px solid rgba(255,255,255,.1);
  background:#293b54;
  opacity:.85;
}

.keyboard{
  position:absolute;
  width:10px;
  height:4px;
  background:#718195;
  border:1px solid #9aa7b5;
}

.light{
  position:absolute;
  width:20px;
  height:4px;
  background:#e3d48b;
  box-shadow:0 0 10px rgba(240,218,137,.7);
}

/* =====================================================
   AGENTS
===================================================== */

.agent{
  position:absolute;
  width:14px;
  height:22px;
  z-index:50;
  pointer-events:none;
  transition:
    left 2.6s linear,
    top 2.6s linear;
}

.agentName{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  font-size:5.5px;
  font-weight:900;
  white-space:nowrap;
  color:#fff;
  text-shadow:
    0 1px 2px #000,
    1px 0 2px #000,
    -1px 0 2px #000;
}

.head{
  position:absolute;
  left:4px;
  top:4px;
  width:7px;
  height:7px;
  background:#efb475;
  border-radius:2px;
}

.hair{
  position:absolute;
  left:3px;
  top:1px;
  width:9px;
  height:5px;
  background:#31231f;
  z-index:3;
}

.body{
  position:absolute;
  left:3px;
  top:11px;
  width:9px;
  height:8px;
  border-radius:1px;
}

.arm{
  position:absolute;
  top:12px;
  width:2px;
  height:7px;
  background:#d99d66;
}

.arm.a{left:1px}
.arm.b{right:1px}

.leg{
  position:absolute;
  top:18px;
  width:3px;
  height:4px;
  background:#39475b;
}

.leg.a{left:3px}
.leg.b{right:2px}

.shoe{
  position:absolute;
  top:21px;
  width:4px;
  height:2px;
  background:#151a20;
}

.shoe.a{left:2px}
.shoe.b{right:1px}

.walking .leg.a{
  animation:walkA .34s infinite alternate;
}

.walking .leg.b{
  animation:walkB .34s infinite alternate;
}

@keyframes walkA{
  to{transform:translateY(-2px)}
}

@keyframes walkB{
  to{transform:translateY(2px)}
}

.working{
  animation:working .7s infinite alternate;
}

@keyframes working{
  to{transform:translateY(-1px)}
}

.sitting{
  transform:translateY(4px) scaleY(.85);
}

/* unique */

.max .body{background:#db598b}
.max .hair{
  border-radius:5px 4px 0 0;
}

.max:after{

  height:3px;

}

.calvin:after{

  top:12px;

}

.rico .body{background:#47ad84}
.rico .hair{

}

.rico:after{

}

.trent .body{background:#dc6461}
.trent .hair{
  background:#d7a255;
  height:5px;

}

.draymond .body{background:#925fdb}
.draymond .hair{

.draymond:after{
  content:"";

  top:11px;
  width:5px;
  height:7px;
  background:#453063;
  border:1px solid #af86ea;
}

.axel .body{background:#e0a744}
.axel .hair{
  background:#c77738;
  clip-path:polygon(0 100%,10% 20%,35% 0,60% 20%,100% 0,100% 100%);
}

.axel:after{
  content:"";
  position:absolute;
  left:4px;
  top:7px;
  width:7px;
  height:1px;
  background:#354257;
}

.adam .body{background:#588fc0}
.adam .hair{
  background:#372d27;
  height:4px;
}

.adam:after{
  content:"";
  position:absolute;
  top:11px;
  right:-2px;
  width:4px;
  height:5px;
  background:#aab6c5;
}

/* =====================================================
   UI
===================================================== */

.taskbar button{
  width:47px;
  height:47px;
  border:0;
  border-radius:14px;
  background:var(--purple);
  color:white;
  font-size:22px;
}

/* small screens */

@media(max-width:450px){
  .office{
    height:760px;
  }
}

<script>

const agents = {
  max: document.getElementById("max"),
  calvin: document.getElementById("calvin"),
  rico: document.getElementById("rico"),
  trent: document.getElementById("trent"),
  draymond: document.getElementById("draymond"),
  axel: document.getElementById("axel"),
  adam: document.getElementById("adam")
};

const rooms = {
  max: document.getElementById("managerRoom"),
  calvin: document.querySelector(".manager"),
  rico: document.getElementById("researchRoom"),
  trent: document.getElementById("testerRoom"),
  draymond: document.getElementById("designerRoom"),
  axel: document.getElementById("analystRoom"),
  adam: document.getElementById("adminRoom")
};

const input = document.getElementById("taskInput");
const button = document.getElementById("sendButton");
const status = document.getElementById("status");

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

/* =====================================================
LEGAL ROUTE NETWORK
===================================================== */

const nodes = {

  researchDesk:[17,20],
  researchDoor:[31,27],

  managerDesk:[52,16],
  managerDoor:[49,27],

  testDesk:[86,23],
  testDoor:[73,31],

  topLeftHall:[35,30],
  topCentre:[49,31],
  topRightHall:[69,34],

  storage:[14,45],
  storageDoor:[25,48],

  centralLeft:[31,44],
  central:[49,42],
  centralRight:[70,45],

  canteenTable:[44,50],
  canteenSofa:[63,57],
  canteenKitchen:[39,40],

  designDoor:[29,65],
  designDesk:[16,68],

  analyticsDoor:[72,69],
  analyticsDesk:[86,72],

  lowerCentre:[49,67],

  utilityDoor:[24,84],
  utility:[15,87],

  archivesDoor:[49,72],
  archivesDesk:[51,87],

  restroomDoor:[79,88],
  restroom:[89,91]
};

const graph = {

  researchDesk:["researchDoor"],
  researchDoor:["researchDesk","topLeftHall"],

  managerDesk:["managerDoor"],
  managerDoor:["managerDesk","topCentre"],

  testDesk:["testDoor"],
  testDoor:["testDesk","topRightHall"],

  topLeftHall:[
    "researchDoor",
    "topCentre",
    "storageDoor",
    "centralLeft"
  ],

  topCentre:[
    "topLeftHall",
    "topRightHall",
    "managerDoor",
    "central"
  ],

  topRightHall:[
    "topCentre",
    "testDoor",
    "centralRight"
  ],

  storage:["storageDoor"],

  storageDoor:[
    "storage",
    "topLeftHall",
    "centralLeft"
  ],

  centralLeft:[
    "topLeftHall",
    "storageDoor",
    "central",
    "designDoor"
  ],

  central:[
    "topCentre",
    "centralLeft",
    "centralRight",
    "canteenKitchen",
    "canteenTable",
    "lowerCentre"
  ],

  centralRight:[
    "topRightHall",
    "central",
    "analyticsDoor"
  ],

  canteenKitchen:[
    "central",
    "canteenTable"
  ],

  canteenTable:[
    "central",
    "canteenKitchen",
    "canteenSofa",
    "lowerCentre"
  ],

  canteenSofa:[
    "canteenTable",
    "analyticsDoor"
  ],

  designDoor:[
    "centralLeft",
    "designDesk",
    "utilityDoor",
    "lowerCentre"
  ],

  designDesk:[
    "designDoor"
  ],

  analyticsDoor:[
    "centralRight",
    "canteenSofa",
    "analyticsDesk",
    "lowerCentre",
    "restroomDoor"
  ],

  analyticsDesk:[
    "analyticsDoor"
  ],

  lowerCentre:[
    "central",
    "canteenTable",
    "designDoor",
    "analyticsDoor",
    "archivesDoor"
  ],

  utilityDoor:[
    "designDoor",
    "utility",
    "archivesDoor"
  ],

  utility:[
    "utilityDoor"
  ],

  archivesDoor:[
    "lowerCentre",
    "utilityDoor",
    "archivesDesk",
    "restroomDoor"
  ],

  archivesDesk:[
    "archivesDoor"
  ],

  restroomDoor:[
    "archivesDoor",
    "analyticsDoor",
    "restroom"
  ],

  restroom:[
    "restroomDoor"
  ]
};

const state = {

  max:{
    node:"managerDesk",
    moving:false,
    busy:false,
    interrupt:false
  },

  calvin:{
    node:"topCentre",
    moving:false,
    busy:false,
    interrupt:false
  },

  rico:{
    node:"researchDesk",
    moving:false,
    busy:false,
    interrupt:false
  },

  trent:{
    node:"testDesk",
    moving:false,
    busy:false,
    interrupt:false
  },

  draymond:{
    node:"designDesk",
    moving:false,
    busy:false,
    interrupt:false
  },

  axel:{
    node:"analyticsDesk",
    moving:false,
    busy:false,
    interrupt:false
  },

  adam:{
    node:"archivesDesk",
    moving:false,
    busy:false,
    interrupt:false
  }
};

const home = {
  max:"managerDesk",
  calvin:"topCentre",
  rico:"researchDesk",
  trent:"testDesk",
  draymond:"designDesk",
  axel:"analyticsDesk",
  adam:"archivesDesk"
};

function place(name,node){

  const p=nodes[node];

  agents[name].style.left=p[0]+"%";
  agents[name].style.top=p[1]+"%";
}

Object.keys(state).forEach(name=>{
  place(name,state[name].node);
});

/* =====================================================
PATH FINDING
===================================================== */

function findPath(start,end){

  if(start===end){
    return [start];
  }

  const queue=[[start]];
  const visited=new Set([start]);

  while(queue.length){

    const route=queue.shift();
    const current=route[route.length-1];

    for(const next of graph[current] || []){

      if(visited.has(next)){
        continue;
      }

      const newRoute=[...route,next];

      if(next===end){
        return newRoute;
      }

      visited.add(next);
      queue.push(newRoute);
    }
  }

  return [start];
}

/* =====================================================
SLOW WALKING
===================================================== */

async function walkTo(name,target){

  if(state[name].moving){
    return;
  }

  state[name].moving=true;

  const agent=agents[name];
  const route=findPath(
    state[name].node,
    target
  );

  agent.classList.remove("sitting");
  agent.classList.add("walking");

  for(let i=1;i<route.length;i++){

    if(state[name].interrupt){
      break;
    }

    const next=route[i];

    place(name,next);

    /*
      THIS IS THE SPEED.
      2700 = 2.7 seconds per section.
    */

    await sleep(2700);

    state[name].node=next;
  }

  agent.classList.remove("walking");
  state[name].moving=false;
}

/* =====================================================
LIVING OFFICE
===================================================== */

const activities = [

  {
    node:"canteenTable",
    sitting:true
  },

  {
    node:"canteenSofa",
    sitting:true
  },

  {
    node:"canteenKitchen",
    sitting:false
  },

  {
    node:"researchDesk",
    sitting:true
  },

  {
    node:"testDesk",
    sitting:true
  },

  {
    node:"designDesk",
    sitting:true
  },

  {
    node:"analyticsDesk",
    sitting:true
  },

  {
    node:"archivesDesk",
    sitting:true
  },

  {
    node:"storage",
    sitting:false
  }
];

async function idleLife(name){

  while(true){

    /*
      WAIT 12–30 SECONDS.
      They no longer constantly wander.
    */

    await sleep(
      12000 +
      Math.random()*18000
    );

    if(state[name].busy){
      continue;
    }

    /*
      65% chance they just stay where they are.
    */

    if(Math.random()<0.65){
      continue;
    }

    const action=
      activities[
        Math.floor(
          Math.random()*activities.length
        )
      ];

    await walkTo(
      name,
      action.node
    );

    if(action.sitting){
      agents[name].classList.add("sitting");
    }

    /*
      Stay there for ages.
    */

    await sleep(
      14000 +
      Math.random()*22000
    );

    agents[name].classList.remove("sitting");
  }
}

Object.keys(state).forEach(name=>{
  idleLife(name);
});

/* =====================================================
WORK
===================================================== */

async function sendToWork(name){

  state[name].busy=true;

  if(state[name].moving){

    state[name].interrupt=true;

    while(state[name].moving){
      await sleep(100);
    }

    state[name].interrupt=false;
  }

  agents[name].classList.remove("sitting");

  await walkTo(
    name,
    home[name]
  );

  agents[name].classList.add("working");

  if(rooms[name]){
    rooms[name].classList.add("active");
  }
}

/* =====================================================
TASK DEMO
===================================================== */

async function runTask(){

  const task=input.value.trim();

  if(!task){

    status.textContent=
      "Give Max a task first";

    return;
  }

  button.disabled=true;

  status.textContent=
    "Max is returning to his office...";

  await sendToWork("max");

  status.textContent=
    "Max is planning the task...";

  await sleep(1600);

  status.textContent=
    "Max is assigning the team...";

  await Promise.all([
    sendToWork("rico"),
    sendToWork("trent"),
    sendToWork("draymond"),
    sendToWork("axel"),
    sendToWork("adam")
  ]);

  status.textContent=
    "Team working...";

  await sleep(7000);

  Object.keys(state).forEach(name=>{

    state[name].busy=false;

    agents[name].classList.remove(
      "working"
    );

    if(rooms[name]){
      rooms[name].classList.remove(
        "active"
      );
    }
  });

  status.textContent="Office idle";

  button.disabled=false;
}

button.addEventListener(
  "click",
  runTask
);

input.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      runTask();
    }
  }
);
