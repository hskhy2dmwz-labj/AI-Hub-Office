<title>AI Office</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --void:#000000;
  --wall:#526173;
  --wallDark:#202a35;
  --wallEdge:#748397;
  --corridor:#7a756c;
  --green:#4be39c;
}

html,body{
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding:16px 8px 116px;
  background:#000;
}

.topbar{
  width:min(100%,650px);
  margin:0 auto 8px;
  padding:4px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:850;
  letter-spacing:-.7px;
}

.online{
  font-size:12px;
  color:#96edc4;
  display:flex;
  align-items:center;
  gap:6px;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 9px rgba(75,227,156,.7);
}

/* ============================================================
   MAP
============================================================ */

.map-shell{
  display:flex;
  justify-content:center;
  width:100%;
}

.map{
  position:relative;
  width:100%;
  max-width:630px;
  height:880px;
  background:#000;
}

/*
IMPORTANT:
There is intentionally NOTHING behind the rooms.

Anything black between rooms/corridors is actual void.
*/

.room{
  position:absolute;
  overflow:hidden;
  z-index:5;
  border:4px solid var(--wallDark);
  outline:2px solid var(--wallEdge);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.05),
    inset 0 0 25px rgba(0,0,0,.18);
}

/* visible floor tiles */

.room::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  opacity:.38;
  pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px);
  background-size:14px 14px;
}

.room-title{
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:3px 7px;
  background:rgba(5,7,10,.85);
  border:1px solid rgba(255,255,255,.15);
  border-radius:2px;
  font-size:6px;
  font-weight:900;
  letter-spacing:.5px;
  white-space:nowrap;
}

<script>

/* ============================================================
   AGENTS
============================================================ */

const agents = {
  max:document.getElementById("max"),
  calvin:document.getElementById("calvin"),
  rico:document.getElementById("rico"),
  trent:document.getElementById("trent"),
  draymond:document.getElementById("draymond"),
  axel:document.getElementById("axel"),
  adam:document.getElementById("adam")
};

const sleep = ms =>
  new Promise(resolve=>setTimeout(resolve,ms));

/* ============================================================
   WALKABLE MAP

ONLY THESE POINTS ARE WALKABLE.

There are deliberately NO points through the black void,
Utility, or Restroom.

Walls therefore act as boundaries.
============================================================ */

const node = {

  /* Research */
  rDesk:[17,17],
  rDoor:[29,23],

  /* Manager */
  mDesk:[52,15],
  mDoor:[52,23],

  /* Test */
  tDesk:[86,19],
  tDoor:[75,27],

  /* upper corridors */
  topL1:[31,24],
  topL2:[31,29],

  topCentreL:[40,30],
  topCentre:[51,30],
  topCentreR:[63,30],

  topR2:[73,30],

  /* storage */
  storeDoor:[24,42],
  storageInside:[13,39],

  /* central */
  canteenNorth:[51,35],
  canteenKitchen:[51,40],
  canteenMiddle:[50,48],
  canteenTable1:[40,48],
  canteenTable2:[42,57],
  canteenSofa:[63,54],

  /* server */
  serverDoor:[77,44],
  serverInside:[88,42],

  /* design */
  canteenDesignDoor:[31,59],
  designHall1:[27,59],
  designDoor:[26,62],
  designInside:[15,62],

  /* analytics */
  canteenAnalytics:[69,62],
  analyticsHall:[75,64],
  analyticsDoor:[77,64],
  analyticsInside:[88,63],

  /* archive */
  canteenSouth:[51,62],
  archiveHall1:[51,67],
  archiveDoor:[51,70],
  archiveDesk:[52,83]
};

const graph = {

  rDesk:["rDoor"],

  rDoor:[
    "rDesk",
    "topL1"
  ],

  topL1:[
    "rDoor",
    "topL2"
  ],

  topL2:[
    "topL1",
    "topCentreL"
  ],

  mDesk:[
    "mDoor"
  ],

  mDoor:[
    "mDesk",
    "topCentre"
  ],

  tDesk:[
    "tDoor"
  ],

  tDoor:[
    "tDesk",
    "topR2"
  ],

  topR2:[
    "tDoor",
    "topCentreR"
  ],

  topCentreL:[
    "topL2",
    "topCentre"
  ],

  topCentre:[
    "topCentreL",
    "topCentreR",
    "mDoor",
    "canteenNorth"
  ],

  topCentreR:[
    "topCentre",
    "topR2"
  ],

  storeDoor:[
    "storageInside",
    "canteenNorth"
  ],

  storageInside:[
    "storeDoor"
  ],

  canteenNorth:[
    "topCentre",
    "storeDoor",
    "canteenKitchen",
    "serverDoor"
  ],

  canteenKitchen:[
    "canteenNorth",
    "canteenMiddle"
  ],

  canteenMiddle:[
    "canteenKitchen",
    "canteenTable1",
    "canteenTable2",
    "canteenSofa",
    "canteenSouth",
    "canteenDesignDoor",
    "canteenAnalytics"
  ],

  canteenTable1:[
    "canteenMiddle"
  ],

  canteenTable2:[
    "canteenMiddle"
  ],

  canteenSofa:[
    "canteenMiddle"
  ],

  serverDoor:[
    "canteenNorth",
    "serverInside"
  ],

  serverInside:[
    "serverDoor"
  ],

  canteenDesignDoor:[
    "canteenMiddle",
    "designHall1"
  ],

  designHall1:[
    "canteenDesignDoor",
    "designDoor"
  ],

  designDoor:[
    "designHall1",
    "designInside"
  ],

  designInside:[
    "designDoor"
  ],

  canteenAnalytics:[
    "canteenMiddle",
    "analyticsHall"
  ],

  analyticsHall:[
    "canteenAnalytics",
    "analyticsDoor"
  ],

  analyticsDoor:[
    "analyticsHall",
    "analyticsInside"
  ],

  analyticsInside:[
    "analyticsDoor"
  ],

  canteenSouth:[

    "archiveHall1"
  ],

    "archiveDoor"
  ],

  archiveDoor:[

    "archiveDesk"
  ],

  archiveDesk:[
    "archiveDoor"
  ]
};

/*
NO NODES FOR:
UTILITY
RESTROOM

They are genuinely unreachable.
*/

const state = {

  max:{
    at:"mDesk",
    busy:false,
    moving:false,
    interrupted:false
  },

  calvin:{
    at:"canteenMiddle",
    busy:false,
    moving:false,
    interrupted:false
  },

  rico:{
    at:"rDesk",
    busy:false,
    moving:false,
    interrupted:false
  },

  trent:{
    at:"tDesk",
    busy:false,
    moving:false,
    interrupted:false
  },

  draymond:{
    at:"designInside",
    busy:false,
    moving:false,
    interrupted:false
  },

  axel:{
    at:"analyticsInside",
    busy:false,
    moving:false,
    interrupted:false
  },

  adam:{
    at:"archiveDesk",
    busy:false,
    moving:false,
    interrupted:false
  }

};

const home = {
  max:"mDesk",
  calvin:"canteenMiddle",
  rico:"rDesk",
  trent:"tDesk",
  draymond:"designInside",
  axel:"analyticsInside",
  adam:"archiveDesk"
};

function positionAgent(name,where){

  const p=node[where];

  agents[name].style.left=p[0]+"%";
  agents[name].style.top=p[1]+"%";
}

Object.keys(state).forEach(name=>{
  positionAgent(name,state[name].at);
});

/* ============================================================
   PATHFINDING
============================================================ */

function route(start,end){

  if(start===end){
    return[start];
  }

  const queue=[[start]];
  const seen=new Set([start]);

  while(queue.length){

    const path=queue.shift();

    const current=
      path[path.length-1];

    for(const next of graph[current]||[]){

      if(seen.has(next)){
        continue;
      }

      const newPath=[
        ...path,
        next
      ];

      if(next===end){
        return newPath;
      }

      seen.add(next);

      queue.push(newPath);
    }
  }

  return[start];
}

/* ============================================================
   WALKING

4.5 seconds PER node section.

A whole journey across the office can therefore take
15–30 seconds depending on distance.
============================================================ */

async function walk(name,destination){

  if(state[name].moving){
    return;
  }

  const person=agents[name];

  const path=
    route(
      state[name].at,
      destination
    );

  state[name].moving=true;

  person.classList.add("walking");

  for(let i=1;i<path.length;i++){

    if(state[name].interrupted){
      break;
    }

    const next=path[i];

    positionAgent(
      name,
      next
    );

    await sleep(4600);

    state[name].at=next;
  }

  person.classList.remove("walking");

  state[name].moving=false;
}

/* ============================================================
   IDLE OFFICE LIFE
============================================================ */

const leisure=[

  "canteenTable1",
  "canteenTable2",
  "canteenSofa",
  "canteenKitchen"

];

async function idle(name){

  while(true){

    /*
    People spend most of their time stationary.
    */

    await sleep(
      18000+
      Math.random()*28000
    );

    if(state[name].busy){
      continue;
    }

    /*
    Only 25% chance they decide to go somewhere.
    */

    if(Math.random()>.25){
      continue;
    }

    const target=
      leisure[
        Math.floor(
          Math.random()*leisure.length
        )
      ];

    await walk(
      name,
      target
    );

    await sleep(
      18000+
      Math.random()*26000
    );

    if(!state[name].busy){

      await walk(
        name,
        home[name]
      );

    }
  }
}

Object.keys(state).forEach(idle);

/* ============================================================
   CARRY COMPLETED WORK TO MAX
============================================================ */

async function deliver(name){

  /*
  Visual delivery happens AFTER work is finished.
  */

  agents[name].classList.add(
    "carrying"
  );

  await walk(
    name,
    "mDoor"
  );

  await walk(
    name,
    "mDesk"
  );

  /*
  Pause beside Max as if handing it over.
  */

  await sleep(1800);

  agents[name].classList.remove(
    "carrying"
  );

  /*
  Return home.
  */

  await walk(
    name,
    home[name]
  );
}

/* ============================================================
   DEMO TASK FLOW
============================================================ */

const input=
  document.getElementById("task");

const send=
  document.getElementById("send");

const status=
  document.getElementById("status");

async function runTask(){

  const text=
    input.value.trim();

  if(!text){

    status.textContent=
      "Give Max a task first";

    return;
  }

  send.disabled=true;

  state.max.busy=true;

  status.textContent=
    "Max is planning...";

  await walk(
    "max",
    "mDesk"
  );

  await sleep(1800);

  /*
  DEMO:
  Draymond creates a visual.
  */

  state.draymond.busy=true;

  status.textContent=
    "Draymond is creating a visual...";

  await walk(
    "draymond",
    "designInside"
  );

  agents.draymond.classList.add(
    "working"
  );

  /*
  Visual representation only.
  Later the real backend starts work immediately.
  */

  await sleep(5000);

  agents.draymond.classList.remove(
    "working"
  );

  status.textContent=
    "Draymond finished — delivering to Max...";

  await deliver(
    "draymond"
  );

  state.draymond.busy=false;
  state.max.busy=false;

  status.textContent=
    "Task delivered to Max";

  await sleep(2500);

  status.textContent=
    "Office idle";

  send.disabled=false;
}

send.addEventListener(
  "click",
  runTask
);

input.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){
      runTask();
    }

  }
);

</script>
