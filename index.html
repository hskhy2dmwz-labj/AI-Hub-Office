<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Office</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --void:#020407;
  --floor:#0d1521;
  --floor2:#111b29;
  --wall:#2b3a50;
  --wall2:#3b4e69;
  --text:#edf3ff;
  --muted:#8e9bb1;
  --purple:#746cff;
  --green:#54d99b;
}

body{
  min-height:100vh;
  background:var(--void);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

.app{
  min-height:100vh;
  padding:14px 8px 110px;
}

.topbar{
  max-width:650px;
  margin:0 auto 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 4px;
}

.topbar h1{
  font-size:22px;
  letter-spacing:-.6px;
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  color:#a0edc8;
  font-size:12px;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(84,217,155,.8);
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  50%{
    transform:scale(1.3);
    opacity:.45;
  }
}

.map-wrap{
  width:100%;
  display:flex;
  justify-content:center;
}

.office{
  position:relative;
  width:100%;
  max-width:620px;
  aspect-ratio:.78;
  background:transparent;
}

/* BUILDING FLOOR */

.building{
  position:absolute;
  inset:2%;
  background:#080d14;
  clip-path:polygon(
    18% 0,
    72% 0,
    72% 7%,
    93% 7%,
    93% 21%,
    100% 21%,
    100% 50%,
    92% 50%,
    92% 76%,
    72% 76%,
    72% 100%,
    28% 100%,
    28% 91%,
    8% 91%,
    8% 73%,
    0 73%,
    0 37%,
    9% 37%,
    9% 15%,
    18% 15%
  );
  border-radius:20px;
}

/* ROOMS */

.room{
  position:absolute;
  background:var(--floor2);
  border:2px solid var(--wall);
  overflow:hidden;
}

.room.active{
  border-color:var(--purple);
  box-shadow:
    inset 0 0 18px rgba(116,108,255,.08),
    0 0 10px rgba(116,108,255,.16);
}

.room-title{
  position:absolute;
  top:5px;
  left:7px;
  font-size:5.5px;
  letter-spacing:.7px;
  color:#aeb9ca;
  font-weight:900;
}

/* ROOM POSITIONS */

.coding{
  left:28%;
  top:3%;
  width:44%;
  height:17%;
  border-radius:12px 12px 5px 5px;
}

.research{
  left:4%;
  top:19%;
  width:31%;
  height:23%;
  border-radius:12px 5px 5px 12px;
}

.manager{
  left:35%;
  top:20%;
  width:30%;
  height:21%;
  border-radius:5px;
}

.testing{
  right:4%;
  top:19%;
  width:31%;
  height:23%;
  border-radius:5px 12px 12px 5px;
}

.canteen{
  left:28%;
  top:42%;
  width:44%;
  height:19%;
  border-radius:5px;
}

.design{
  left:4%;
  top:47%;
  width:31%;
  height:23%;
  border-radius:12px 5px 5px 12px;
}

.analytics{
  right:4%;
  top:47%;
  width:31%;
  height:23%;
  border-radius:5px 12px 12px 5px;
}

.archives{
  left:27%;
  top:69%;
  width:46%;
  height:25%;
  border-radius:5px 5px 12px 12px;
}

/* HALLWAYS */

.hall{
  position:absolute;
  background:#0f1825;
  border:1px solid #26364d;
}

.h-top{
  left:47%;
  top:19%;
  width:6%;
  height:3%;
}

.h-left1{
  left:33%;
  top:30%;
  width:4%;
  height:6%;
}

.h-right1{
  right:33%;
  top:30%;
  width:4%;
  height:6%;
}

.h-mid{
  left:47%;
  top:40%;
  width:6%;
  height:3%;
}

.h-left2{
  left:33%;
  top:54%;
  width:4%;
  height:6%;
}

.h-right2{
  right:33%;
  top:54%;
  width:4%;
  height:6%;
}

.h-bottom{
  left:47%;
  top:60%;
  width:6%;
  height:10%;
}

/* DOORS */

.door{
  position:absolute;
  z-index:4;
  background:#131d2a;
}

.door.v{
  width:8px;
  height:16px;
}

.door.h{
  width:16px;
  height:8px;
}

/* GENERIC DECOR */

.desk{
  position:absolute;
  width:26px;
  height:10px;
  background:#3b4c64;
  border:1px solid #58708d;
  border-radius:2px;
}

.screen{
  position:absolute;
  width:11px;
  height:8px;
  background:#0e2039;
  border:1px solid #667fa0;
  border-radius:2px;
}

.room.active .screen{
  background:#6d74ff;
  box-shadow:0 0 8px rgba(109,116,255,.8);
}

.chair{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:3px;
  background:#26364e;
  border:1px solid #43556f;
}

.rug{
  position:absolute;
  background:#1b2840;
  border:1px solid #293b58;
  border-radius:5px;
}

.plant{
  position:absolute;
  width:10px;
  height:13px;
}

.plant:before{
  content:"";
  position:absolute;
  top:0;
  left:2px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#42a476;
  box-shadow:
    -3px 2px #347d60,
    3px 2px #4bb283,
    0 -2px #3c906c;
}

.plant:after{
  content:"";
  position:absolute;
  bottom:0;
  left:3px;
  width:6px;
  height:5px;
  background:#865c3b;
}

.server{
  position:absolute;
  width:11px;
  height:31px;
  background:#1d293a;
  border:1px solid #52637b;
}

.server:after{
  content:"";
  position:absolute;
  left:2px;
  top:5px;
  width:2px;
  height:2px;
  background:#5fe09e;
  box-shadow:
    4px 0 #7588ff,
    0 5px #e7bb58,
    4px 5px #5fe09e,
    0 10px #7588ff,
    4px 10px #e26b6b,
    0 15px #5fe09e,
    4px 15px #7588ff;
}

.shelf{
  position:absolute;
  width:12px;
  height:35px;
  background:#4b3a31;
  border:1px solid #6e5547;
}

.shelf:after{
  content:"";
  position:absolute;
  left:2px;
  top:4px;
  width:8px;
  height:4px;
  background:#7386ad;
  box-shadow:
    0 7px #bc895d,
    0 14px #6fa17c,
    0 21px #9d74aa;
}

.board{
  position:absolute;
  width:32px;
  height:13px;
  background:#dce3eb;
  border:1px solid #8d9caf;
  border-radius:2px;
}

.board:after{
  content:"AI ↗ ?";
  position:absolute;
  left:5px;
  top:3px;
  color:#58687b;
  font-size:4px;
}

.sofa{
  position:absolute;
  width:30px;
  height:12px;
  background:#3d4d6b;
  border:1px solid #5e7191;
  border-radius:5px;
}

.table{
  position:absolute;
  width:17px;
  height:11px;
  background:#6b5040;
  border:1px solid #8a6c58;
  border-radius:50%;
}

.vending{
  position:absolute;
  width:15px;
  height:31px;
  background:#34485e;
  border:1px solid #617995;
}

.vending:before{
  content:"";
  position:absolute;
  left:3px;
  top:4px;
  width:9px;
  height:16px;
  background:
    linear-gradient(
      #e36d6d 0 20%,
      #6d9cda 20% 40%,
      #63b98a 40% 60%,
      #e6ba57 60% 80%,
      #9a74d6 80%
    );
}

.fridge{
  position:absolute;
  width:13px;
  height:28px;
  background:#7f8da0;
  border:1px solid #9ba8b8;
}

.coffee{
  position:absolute;
  width:12px;
  height:14px;
  background:#45566b;
  border:1px solid #697c92;
}

.coffee:after{
  content:"";
  position:absolute;
  bottom:2px;
  left:4px;
  width:4px;
  height:4px;
  background:#eee;
}

.cabinet{
  position:absolute;
  width:11px;
  height:26px;
  background:#415064;
  border:1px solid #66788d;
}

.cabinet:after{
  content:"";
  position:absolute;
  left:2px;
  top:6px;
  width:6px;
  height:1px;
  background:#a8b4c2;
  box-shadow:
    0 7px #a8b4c2,
    0 14px #a8b4c2;
}

.poster{
  position:absolute;
  width:12px;
  height:16px;
  background:#1c3358;
  border:1px solid #4d6486;
}

.poster:after{
  content:"★";
  position:absolute;
  left:3px;
  top:2px;
  font-size:6px;
  color:#c6d5ff;
}

.bin{
  position:absolute;
  width:7px;
  height:8px;
  background:#344356;
  border-radius:1px 1px 2px 2px;
}

.lamp{
  position:absolute;
  width:4px;
  height:11px;
  background:#54647a;
}

.lamp:before{
  content:"";
  position:absolute;
  top:-3px;
  left:-3px;
  width:10px;
  height:5px;
  background:#d7bd6a;
  border-radius:50% 50% 2px 2px;
}

/* PEOPLE */

.agent{
  position:absolute;
  width:11px;
  height:16px;
  z-index:50;
  pointer-events:none;
  transition:
    left 1.2s linear,
    top 1.2s linear;
}

.agent-name{
  position:absolute;
  bottom:19px;
  left:50%;
  transform:translateX(-50%);
  font-size:4.7px;
  font-weight:800;
  white-space:nowrap;
  color:white;
  text-shadow:
    0 1px 2px #000,
    0 0 3px #000;
}

.face{
  position:absolute;
  left:3px;
  top:3px;
  width:6px;
  height:5px;
  background:#efb06d;
  border-radius:1px;
}

.hair{
  position:absolute;
  left:3px;
  top:1px;
  width:6px;
  height:3px;
  z-index:2;
  background:#362a22;
}

.shirt{
  position:absolute;
  left:2px;
  top:8px;
  width:8px;
  height:6px;
  border-radius:1px;
}

.leg{
  position:absolute;
  top:13px;
  width:2px;
  height:3px;
  background:#48556d;
}

.leg.left{
  left:3px;
}

.leg.right{
  right:3px;
}

.walking .leg.left{
  animation:walkL .3s infinite alternate;
}

.walking .leg.right{
  animation:walkR .3s infinite alternate;
}

@keyframes walkL{
  to{transform:translateY(-1px)}
}

@keyframes walkR{
  to{transform:translateY(1px)}
}

.sitting{
  transform:translateY(2px) scaleY(.9);
}

.working{
  animation:workBob .65s infinite alternate;
}

@keyframes workBob{
  to{transform:translateY(-1px)}
}

/* UNIQUE PEOPLE */

.max .shirt{background:#dc5a8b;}
.max .hair{
  background:#33241f;
  border-radius:3px 3px 0 0;
}

.calvin .shirt{background:#6678ff;}
.calvin .hair{
  background:#423023;
  height:2px;
}

.rico .shirt{background:#3faf88;}
.rico .hair{
  background:#14171a;
  border-radius:4px 4px 1px 1px;
}

.trent .shirt{background:#dc6565;}
.trent .hair{
  background:#d7a657;
  height:3px;
}

.draymond .face{
  background:#71482f;
}

.draymond .shirt{background:#9c66ed;}
.draymond .hair{
  background:#101112;
  border-radius:4px 4px 1px 1px;
}

.axel .shirt{background:#dfa948;}
.axel .hair{background:#bd7e43;}

.adam .shirt{background:#6491b8;}
.adam .hair{
  background:#3d332c;
  height:2px;
}

/* UI */

.status{
  position:fixed;
  left:50%;
  bottom:78px;
  transform:translateX(-50%);
  color:var(--muted);
  font-size:10px;
  z-index:100;
}

.taskbar{
  position:fixed;
  left:50%;
  bottom:13px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:620px;
  height:56px;
  display:flex;
  padding:6px;
  gap:6px;
  background:rgba(7,11,18,.96);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  backdrop-filter:blur(16px);
  z-index:100;
}

.taskbar input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  padding:0 10px;
  font-size:14px;
}

.taskbar button{
  width:46px;
  border:none;
  border-radius:12px;
  background:var(--purple);
  color:white;
  font-size:20px;
}
</style>
</head>

<div class="agent adam" id="adam">
  <div class="agent-name">Adam</div>
  <div class="hair"></div>
  <div class="face"></div>
  <div class="shirt"></div>
  <div class="leg left"></div>
  <div class="leg right"></div>
</div>

</div>
</div>
</div>

<div class="status" id="status">
Office idle
</div>

<div class="taskbar">
  <input
    id="taskInput"
    autocomplete="off"
    placeholder="Give Max a task..."
  >
  <button id="sendButton">↑</button>
</div>

<script>

const agents = {
  max: document.getElementById("max"),
  calvin: document.getElementById("calvin"),
  rico: document.getElementById("rico"),
  trent: document.getElementById("trent"),
  draymond: document.getElementById("draymond"),
  axel: document.getElementById("axel"),
  adam: document.getElementById("adam")
};

const rooms = {
  max: document.getElementById("managerRoom"),
  calvin: document.getElementById("coderRoom"),
  rico: document.getElementById("researchRoom"),
  trent: document.getElementById("testerRoom"),
  draymond: document.getElementById("designerRoom"),
  axel: document.getElementById("analystRoom"),
  adam: document.getElementById("adminRoom")
};

const input = document.getElementById("taskInput");
const button = document.getElementById("sendButton");
const status = document.getElementById("status");

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

/*
LEGAL WALKING POINTS

These are doors, hallways and actual usable spots.
Agents move between these only.
*/

const nodes = {

  codingDesk:[50,12],
  codingDoor:[50,20],

  managerNorth:[50,22],
  managerDesk:[50,31],
  managerSouth:[50,41],

  researchDoor:[34,31],
  researchDesk:[18,31],

  testDoor:[66,31],
  testDesk:[82,31],

  canteenNorth:[50,44],
  canteenCentre:[50,51],
  canteenCoffee:[38,52],
  canteenTable:[54,52],
  canteenSofa:[64,56],
  canteenSouth:[50,61],

  designDoor:[34,58],
  designDesk:[18,58],

  analyticsDoor:[66,58],
  analyticsDesk:[82,58],

  lowerHall:[50,66],

  archivesDoor:[50,70],
  archivesDesk:[50,84],

  leftHub:[38,43],
  rightHub:[62,43],

  leftLower:[38,63],
  rightLower:[62,63]
};

/*
CONNECTIONS.

There is no connection unless a real doorway/corridor
exists between those points.
*/

const graph = {

  codingDesk:["codingDoor"],
  codingDoor:["codingDesk","managerNorth"],

  managerNorth:[
    "codingDoor",
    "managerDesk",
    "researchDoor",
    "testDoor"
  ],

  managerDesk:[
    "managerNorth",
    "managerSouth"
  ],

  managerSouth:[
    "managerDesk",
    "canteenNorth",
    "leftHub",
    "rightHub"
  ],

  researchDoor:[
    "managerNorth",
    "researchDesk"
  ],

  researchDesk:["researchDoor"],

  testDoor:[
    "managerNorth",
    "testDesk"
  ],

  testDesk:["testDoor"],

  leftHub:[
    "managerSouth",
    "designDoor",
    "canteenNorth"
  ],

  rightHub:[
    "managerSouth",
    "analyticsDoor",
    "canteenNorth"
  ],

  canteenNorth:[
    "managerSouth",
    "leftHub",
    "rightHub",
    "canteenCentre"
  ],

  canteenCentre:[
    "canteenNorth",
    "canteenCoffee",
    "canteenTable",
    "canteenSofa",
    "canteenSouth"
  ],

  canteenCoffee:["canteenCentre"],
  canteenTable:["canteenCentre"],
  canteenSofa:["canteenCentre"],

  canteenSouth:[
    "canteenCentre",
    "leftLower",
    "rightLower",
    "lowerHall"
  ],

  designDoor:[
    "leftHub",
    "leftLower",
    "designDesk"
  ],

  designDesk:["designDoor"],

  analyticsDoor:[
    "rightHub",
    "rightLower",
    "analyticsDesk"
  ],

  analyticsDesk:["analyticsDoor"],

  leftLower:[
    "designDoor",
    "canteenSouth",
    "lowerHall"
  ],

  rightLower:[
    "analyticsDoor",
    "canteenSouth",
    "lowerHall"
  ],

  lowerHall:[
    "canteenSouth",
    "leftLower",
    "rightLower",
    "archivesDoor"
  ],

  archivesDoor:[
    "lowerHall",
    "archivesDesk"
  ],

  archivesDesk:["archivesDoor"]
};

const state = {

  max:{
    node:"managerDesk",
    busy:false,
    moving:false
  },

  calvin:{
    node:"codingDesk",
    busy:false,
    moving:false
  },

  rico:{
    node:"researchDesk",
    busy:false,
    moving:false
  },

  trent:{
    node:"testDesk",
    busy:false,
    moving:false
  },

  draymond:{
    node:"designDesk",
    busy:false,
    moving:false
  },

  axel:{
    node:"analyticsDesk",
    busy:false,
    moving:false
  },

  adam:{
    node:"archivesDesk",
    busy:false,
    moving:false
  }

};

const home = {

  max:"managerDesk",
  calvin:"codingDesk",
  rico:"researchDesk",
  trent:"testDesk",
  draymond:"designDesk",
  axel:"analyticsDesk",
  adam:"archivesDesk"

};

function place(name,node){

  const point=nodes[node];

  agents[name].style.left=point[0]+"%";
  agents[name].style.top=point[1]+"%";

}

Object.keys(state).forEach(name=>{
  place(name,state[name].node);
});

/*
SHORTEST LEGAL PATH
*/

function pathfind(start,end){

  if(start===end){
    return [start];
  }

  const queue=[[start]];
  const visited=new Set([start]);

  while(queue.length){

    const path=queue.shift();

    const current=path[path.length-1];

    for(const next of graph[current] || []){

      if(visited.has(next)){
        continue;
      }

      const route=[...path,next];

      if(next===end){
        return route;
      }

      visited.add(next);
      queue.push(route);
    }

  }

  return [start];

}

/*
REAL WALK SPEED

1.2 seconds for each section.
*/

async function walkTo(name,target){

  if(state[name].moving){
    return;
  }

  state[name].moving=true;

  const agent=agents[name];

  const route=pathfind(
    state[name].node,
    target
  );

  agent.classList.remove("sitting");
  agent.classList.add("walking");

  for(let i=1;i<route.length;i++){

    if(state[name].interrupt){
      break;
    }

    const next=route[i];

    place(name,next);

    await sleep(1250);

    state[name].node=next;
  }

  agent.classList.remove("walking");

  state[name].moving=false;
}

/*
IDLE LOCATIONS

People spend most of their time doing something,
NOT constantly wandering.
*/

const idleActivities = [

  {
    place:"canteenCoffee",
    sitting:false
  },

  {
    place:"canteenTable",
    sitting:true
  },

  {
    place:"canteenSofa",
    sitting:true
  },

  {
    place:"codingDesk",
    sitting:true
  },

  {
    place:"researchDesk",
    sitting:true
  },

  {
    place:"testDesk",
    sitting:true
  },

  {
    place:"designDesk",
    sitting:true
  },

  {
    place:"analyticsDesk",
    sitting:true
  },

  {
    place:"archivesDesk",
    sitting:true
  }

];

async function idleLife(name){

  while(true){

    /*
    Long idle periods.
    */

    await sleep(
      9000 +
      Math.random()*16000
    );

    if(state[name].busy){
      continue;
    }

    /*
    Often they just stay where they are.
    */

    if(Math.random()<0.55){
      continue;
    }

    const activity=
      idleActivities[
        Math.floor(
          Math.random()*idleActivities.length
        )
      ];

    await walkTo(
      name,
      activity.place
    );

    if(activity.sitting){
      agents[name].classList.add("sitting");
    }

    /*
    Actually hang around there.
    */

    await sleep(
      9000 +
      Math.random()*18000
    );

    agents[name].classList.remove("sitting");
  }

}

Object.keys(state).forEach(name=>{
  idleLife(name);
});

/*
SEND TO WORK
*/

async function sendToWork(name){

  state[name].busy=true;
  state[name].interrupt=true;

  while(state[name].moving){
    await sleep(100);
  }

  state[name].interrupt=false;

  agents[name].classList.remove("sitting");

  await walkTo(
    name,
    home[name]
  );

  agents[name].classList.add("working");

  rooms[name].classList.add("active");
}

/*
TASK VISUALISATION

Actual AI backend gets connected later.
*/

async function runTask(){

  const task=input.value.trim();

  if(!task){

    status.textContent=
      "Give Max a task first";

    return;
  }

  status.textContent=
    "Max is heading to his desk...";

  await sendToWork("max");

  status.textContent=
    "Max is planning...";

  await sleep(1200);

  status.textContent=
    "Max is assigning the team...";

  sendToWork("calvin");
  sendToWork("rico");
  sendToWork("trent");
  sendToWork("draymond");
  sendToWork("axel");
  sendToWork("adam");

  await sleep(6000);

  status.textContent=
    "Team working...";

  await sleep(6000);

  Object.keys(state).forEach(name=>{

    state[name].busy=false;

    agents[name].classList.remove(
      "working"
    );

    rooms[name].classList.remove(
      "active"
    );

  });

  status.textContent=
    "Office idle";
}

button.addEventListener(
  "click",
  runTask
);

input.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){
      runTask();
    }

  }
);

</script>

</body>
</html>
