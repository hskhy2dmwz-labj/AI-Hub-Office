:root{
  --void:#020305;

  --wall1:#202b35;
  --wall2:#3a4854;
  --wall3:#64717b;
  --line:#080b0e;
  --corridor:#1d252c;
}

html,body{
  margin:0;

    radial-gradient(circle at 50% 30%,#080b10 0,#030406 42%,#000 100%);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100%;
}

body{
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
}

/* =========================================================
   TOP
========================================================= */

.topbar{
  width:min(100%,780px);
  margin:auto;
  padding:22px 26px 9px;
}

.title{
  font-size:38px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.5px;
}

.online{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#2fd267;
  font-size:14px;
}

.online-dot{
  width:11px;
  height:11px;
  background:#2fd267;
  border-radius:50%;
  box-shadow:0 0 12px rgba(47,210,103,.6);
}

/* =========================================================
   MAP SHELL
========================================================= */

.map-shell{
  width:100%;
  display:flex;
  justify-content:center;
  overflow:hidden;
}

.office{
  position:relative;
  width:760px;
  height:1240px;
  flex:0 0 760px;
  transform-origin:top center;
  background:transparent;
}

/* Black void is literally the office background. */

.room,
.corridor{
  position:absolute;
}

/* =========================================================
   WALL SYSTEM
========================================================= */

.room{
  border:8px solid var(--wall1);
  outline:2px solid #050709;
  box-shadow:
    inset 0 0 0 2px var(--wall3),
    inset 0 0 0 5px #141b21,
    0 8px 18px #000;
  overflow:hidden;
}

.room::before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(255,255,255,.08);
  pointer-events:none;
  z-index:10;
}

.room::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:7px;
  height:3px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3),
    transparent
  );
  opacity:.55;
  pointer-events:none;
  z-index:11;
}

.room-label{
  position:absolute;
  z-index:30;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:#0a0d11;
  border:1px solid #46515b;
  box-shadow:0 2px 4px #000;
  padding:5px 10px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.3px;
  white-space:nowrap;
}

/* =========================================================
   CORRIDORS
========================================================= */

.corridor{
  z-index:2;
  background:
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    var(--corridor);
  background-size:18px 18px;
  border:6px solid var(--wall1);
  outline:2px solid #050709;
  box-shadow:
    inset 0 0 0 2px #53606a,
    inset 0 0 14px #070a0d,
    0 4px 12px #000;
}

/* =========================================================

========================================================= */

.object{
  position:absolute;

}

}

.plant{
  width:26px;
  height:38px;
}

.plant::before{
  content:"";
  position:absolute;
  width:22px;
  height:25px;
  left:2px;
  top:0;
  background:
    radial-gradient(ellipse at 25% 55%,#3d9b46 0 24%,transparent 27%),

}

.plant::after{
  content:"";
  position:absolute;
  left:6px;
  bottom:0;
  width:15px;
  height:14px;
  background:#75442a;
  border:2px solid #321d13;
  border-radius:2px 2px 6px 6px;
}

.crate{
  background:#72502a;
  border:3px solid #2c1c0d;
  box-shadow:inset 0 0 0 2px #9a7541;
}

.crate::before,
.crate::after{
  content:"";
  position:absolute;
  background:#35210f;
}

.crate::before{
  width:3px;
  height:100%;
  left:50%;
}

.crate::after{
  height:3px;
  width:100%;
  top:50%;
}

/* shadow */

.agent .shadow{

  height:8px;

    inset 2px 2px rgba(255,255,255,.14);
}

/* ears */

.agent .head::before,
.agent .head::after{
  content:"";
  position:absolute;
  top:8px;
  width:4px;
  height:7px;
  background:var(--skin);
  border-radius:50%;
}

.agent .head::before{left:-3px;}
.agent .head::after{right:-3px;}

/* hair */

.agent .hair{
  position:absolute;
  left:6px;
  top:2px;
  width:22px;
  height:12px;
  background:var(--hair);
  border-radius:9px 9px 4px 4px;
  box-shadow:
    inset 3px 2px rgba(255,255,255,.09),
    inset -3px -2px rgba(0,0,0,.3);
}

.agent .hair::after{
  content:"";
  position:absolute;
  left:1px;
  bottom:-4px;
  width:5px;
  height:8px;
  background:var(--hair);
  border-radius:0 0 4px 4px;
}

/* face */

.agent .eyes{
  position:absolute;
  top:13px;
  left:11px;
  width:3px;
  height:3px;
  background:#17120f;
  border-radius:50%;
  box-shadow:9px 0 #17120f;
}

.agent .nose{
  position:absolute;
  left:16px;
  top:16px;
  width:2px;
  height:3px;
  background:rgba(80,35,22,.35);
}

/* torso */

.agent .body{
  position:absolute;
  left:7px;
  top:24px;
  width:20px;
  height:16px;
  background:var(--shirt);
  border-radius:5px 5px 3px 3px;
  box-shadow:
    inset -4px 0 rgba(0,0,0,.25),
    inset 3px 2px rgba(255,255,255,.13);
}

.agent .body::after{
  content:"";
  position:absolute;
  left:3px;
  right:3px;
  top:5px;
  height:2px;
  background:rgba(255,255,255,.16);
}

/* arms */

.agent .arm{
  position:absolute;
  top:26px;
  width:6px;
  height:15px;
  background:var(--shirt);
  border-radius:4px;
  transform-origin:top center;
  box-shadow:inset -2px 0 rgba(0,0,0,.2);
}

.agent .arm::after{
  content:"";
  position:absolute;
  left:1px;
  bottom:-3px;
  width:5px;
  height:5px;
  background:var(--skin);
  border-radius:50%;
}

.agent .arm.left{
  left:3px;
  transform:rotate(7deg);
}

.agent .arm.right{
  right:3px;
  transform:rotate(-7deg);
}

/* legs */

.agent .leg{
  position:absolute;
  top:38px;
  width:7px;
  height:9px;
  background:var(--pants);
  box-shadow:inset -2px 0 rgba(0,0,0,.3);
  transform-origin:top center;
}

.agent .leg.left{left:9px;}
.agent .leg.right{right:9px;}

.agent .leg::after{
  content:"";
  position:absolute;
  bottom:-3px;
  width:9px;
  height:4px;
  background:var(--shoe);
  border-radius:3px 3px 2px 2px;
}

/* walk animation */

.agent.walking .leg.left,
.agent.walking .arm.right{
  animation:limbA .55s infinite alternate ease-in-out;
}

.agent.walking .leg.right,
.agent.walking .arm.left{
  animation:limbB .55s infinite alternate ease-in-out;
}

.agent.walking{
  animation:bob .55s infinite alternate ease-in-out;
}

@keyframes limbA{
  from{transform:rotate(-13deg)}
  to{transform:rotate(13deg)}
}

@keyframes limbB{
  from{transform:rotate(13deg)}
  to{transform:rotate(-13deg)}
}

@keyframes bob{
  from{margin-top:0}
  to{margin-top:-2px}
}

<script>

/* =========================================================

   That means nobody should walk straight through a wall
   or across the black void.
========================================================= */

const nodes = {

  /* research */

  researchDoor: {x:205,y:300},

  upperLeft: {x:242,y:126},

  canteenTable: {x:285,y:660},

  /* design */
  designDoor: {x:173,y:705},

  analyticsDoor: {x:586,y:705},
  analyticsDesk: {x:655,y:840},

  /* archives */
  archiveTop: {x:381,y:929},
  archiveDesk: {x:381,y:1075},

  /* lower corridor */
  lowerLeft: {x:177,y:930},
  lowerRight: {x:584,y:930},

  /* utility */
  utilityHallTop: {x:154,y:950},
  utilityHallBottom: {x:154,y:1083},
  utilityDoor: {x:120,y:1085},
  utilityInside: {x:105,y:1140},

  /* restroom */
  restroomHallTop: {x:607,y:950},
  restroomHallBottom: {x:607,y:1084},
  restroomDoor: {x:630,y:1085},
  restroomInside: {x:660,y:1140}
};


/* =========================================================
   WALKABLE GRAPH

   An edge means the two points are joined by a legal
   straight walking route.

   Turns require separate nodes.

   No wall crossing.
========================================================= */

const graph = {

  researchDesk:["researchDoor"],
  researchDoor:["researchDesk","leftHallTop"],

  managerDesk:["managerDoor"],
  managerDoor:["managerDesk","upperCentre"],

  testDesk:["testDoor"],
  testDoor:["testDesk","rightHallTop"],

  upperLeft:["leftHallTop"],
  upperRight:["rightHallTop"],

  leftHallTop:[
    "researchDoor",
    "upperLeft",
    "leftHallBottom"
  ],

  leftHallBottom:[
    "leftHallTop",
    "storageDoor",
    "upperCentre",
    "canteenTop"
  ],

  rightHallTop:[
    "testDoor",
    "upperRight",
    "rightHallBottom"
  ],

  rightHallBottom:[
    "rightHallTop",
    "serverDoor",
    "upperCentre",
    "canteenTop"
  ],

  upperCentre:[
    "managerDoor",
    "leftHallBottom",
    "rightHallBottom",
    "canteenTop"
  ],

  storageDoor:[
    "leftHallBottom",
    "storageInside"
  ],

  storageInside:["storageDoor"],

  serverDoor:[
    "rightHallBottom",
    "serverInside"
  ],

  serverInside:["serverDoor"],

  canteenTop:[
    "upperCentre",
    "leftHallBottom",
    "rightHallBottom",

  ],

  canteenCentre:[
    "canteenTop",
    "canteenTable",
    "canteenLounge",
    "canteenLeft",
    "canteenRight",
    "canteenBottom"
  ],

  canteenTable:["canteenCentre"],

  canteenLounge:["canteenCentre"],

  canteenLeft:[
    "canteenCentre",
    "designDoor"
  ],

  canteenRight:[
    "canteenCentre",
    "analyticsDoor"
  ],

  designDoor:[
    "canteenLeft",
    "designDesk",
    "lowerLeft"
  ],

  designDesk:["designDoor"],

  analyticsDoor:[
    "canteenRight",
    "analyticsDesk",
    "lowerRight"
  ],

  analyticsDesk:["analyticsDoor"],

  canteenBottom:[
    "canteenCentre",
    "archiveTop"
  ],

  archiveTop:[
    "canteenBottom",
    "archiveDesk",
    "lowerLeft",
    "lowerRight"
  ],

  archiveDesk:["archiveTop"],

  lowerLeft:[
    "designDoor",
    "archiveTop",
    "utilityHallTop"
  ],

  lowerRight:[
    "analyticsDoor",
    "archiveTop",
    "restroomHallTop"
  ],

  utilityHallTop:[
    "lowerLeft",
    "utilityHallBottom"
  ],

  utilityHallBottom:[
    "utilityHallTop",
    "utilityDoor"
  ],

  utilityDoor:[
    "utilityHallBottom",
    "utilityInside"
  ],

  utilityInside:["utilityDoor"],

  restroomHallTop:[
    "lowerRight",
    "restroomHallBottom"
  ],

  restroomHallBottom:[
    "restroomHallTop",
    "restroomDoor"
  ],

  restroomDoor:[
    "restroomHallBottom",
    "restroomInside"
  ],

  restroomInside:["restroomDoor"]
};
  /* =========================================================
   HOME LOCATIONS
========================================================= */

const homes = {
  rico:"researchDesk",
  max:"managerDesk",
  trent:"testDesk",
  calvin:"canteenCentre",
  draymond:"designDesk",
  axel:"analyticsDesk",
  adam:"archiveDesk",
  jared:"utilityInside"
};


/* Current logical node for every person */

const currentNode = {
  rico:"researchDesk",
  max:"managerDesk",
  trent:"testDesk",
  calvin:"canteenCentre",
  draymond:"designDesk",
  axel:"analyticsDesk",
  adam:"archiveDesk",
  jared:"utilityInside"
};


/* =========================================================
   PATHFINDING — BFS
========================================================= */

function findPath(start,end){

  if(start === end){
    return [start];
  }

  const queue = [[start]];
  const visited = new Set([start]);

  while(queue.length){

    const path = queue.shift();
    const last = path[path.length - 1];

    for(const next of graph[last] || []){

      if(visited.has(next)){
        continue;
      }

      const newPath = [...path,next];

      if(next === end){
        return newPath;
      }

      visited.add(next);
      queue.push(newPath);
    }
  }

  return [];
}


/* =========================================================
   UTILITY
========================================================= */

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}

function distance(a,b){

  const dx = b.x-a.x;
  const dy = b.y-a.y;

  return Math.sqrt(
    dx*dx +
    dy*dy
  );
}


/* =========================================================
   WALK SPEED

   Lower number = slower.

   28 pixels/second means a long journey across the office
   actually takes a while.

   Minimum duration prevents tiny corridor steps from
   snapping instantly.
========================================================= */

const WALK_SPEED = 28;

async function moveOneStep(person,nodeName){

  const el = document.getElementById(person);

  if(!el || !nodes[nodeName]){
    return;
  }

  const oldName = currentNode[person];

  const oldPos =
    nodes[oldName] ||
    nodes[nodeName];

  const newPos =
    nodes[nodeName];

  const dist =
    distance(oldPos,newPos);

  let duration =
    (dist / WALK_SPEED) * 1000;

  duration =
    Math.max(850,duration);

  el.style.transitionDuration =
    duration + "ms";

  el.classList.add("walking");

  el.style.left =
    newPos.x + "px";

  el.style.top =
    newPos.y + "px";

  await sleep(duration);

  el.classList.remove("walking");

  currentNode[person] =
    nodeName;
}


/* =========================================================
   WALK PERSON TO DESTINATION
========================================================= */

async function walkTo(person,destination){

  const start =
    currentNode[person];

  const path =
    findPath(start,destination);

  if(!path.length){
    console.warn(
      "No legal path:",
      person,
      start,
      destination
    );
    return;
  }

  for(let i=1;i<path.length;i++){

    await moveOneStep(
      person,
      path[i]
    );
  }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  document.getElementById("status")
    .textContent = text;
}


/* =========================================================
   DELIVERY SYSTEM

   Agent finishes work BEFORE delivery animation.

   The animation NEVER needs to represent actual backend
   processing time.
========================================================= */

async function deliverToMax(person){

  if(person === "max"){
    return;
  }

  const el =
    document.getElementById(person);

  el.classList.add("carrying");

  setStatus(
    capitalize(person) +
    " is delivering work to Max"
  );

  await walkTo(
    person,
    "managerDoor"
  );

  await sleep(1100);

  /* Hand-off */
  el.classList.remove("carrying");

  setStatus(
    capitalize(person) +
    " delivered the work"
  );

  await sleep(900);

  await walkTo(
    person,
    homes[person]
  );

  setStatus("Office idle");
}


/* =========================================================
   JARED

   Jared is NOT an AI agent.

   He is an office NPC.

   He walks legal routes and periodically cleans different
   parts of the office.
========================================================= */

const jaredStops = [
  "utilityInside",
  "archiveTop",
  "canteenBottom",
  "canteenCentre",
  "leftHallBottom",
  "rightHallBottom",
  "storageDoor",
  "serverDoor",
  "designDoor",
  "analyticsDoor",
  "restroomInside"
];

let jaredBusy = false;

async function jaredClean(){

  if(jaredBusy){
    return;
  }

  jaredBusy = true;

  const target =
    jaredStops[
      Math.floor(
        Math.random() *
        jaredStops.length
      )
    ];

  await walkTo(
    "jared",
    target
  );

  const jared =
    document.getElementById("jared");

  jared.classList.add("cleaning");

  await sleep(
    3500 +
    Math.random()*3500
  );

  jared.classList.remove("cleaning");

  jaredBusy = false;
}


/* Jared doesn't sprint around constantly. */

function scheduleJared(){

  const delay =
    18000 +
    Math.random()*24000;

  setTimeout(async()=>{

    await jaredClean();
    scheduleJared();

  },delay);
}

scheduleJared();


/* =========================================================
   NORMAL IDLE BEHAVIOUR

   Agents mostly stay where they belong.

   Occasionally someone goes to the canteen or another
   sensible office location.

   They do NOT wander every few seconds.
========================================================= */

const leisureTargets = {
  rico:[
    "canteenTable",
    "canteenCentre"
  ],

  trent:[
    "canteenLounge",
    "canteenCentre"
  ],

  calvin:[
    "canteenTable",
    "canteenLounge"
  ],

  draymond:[
    "canteenTable",
    "canteenLounge"
  ],

  axel:[
    "canteenCentre",
    "canteenLounge"
  ],

  adam:[
    "canteenTable",
    "canteenCentre"
  ]
};

const busy = new Set();

async function idleTrip(person){

  if(busy.has(person)){
    return;
  }

  /* Only a small chance */
  if(Math.random() > .28){
    return;
  }

  busy.add(person);

  const choices =
    leisureTargets[person];

  if(!choices){
    busy.delete(person);
    return;
  }

  const destination =
    choices[
      Math.floor(
        Math.random()*choices.length
      )
    ];

  await walkTo(
    person,
    destination
  );

  /* actually stay there for a bit */

  await sleep(
    10000 +
    Math.random()*18000
  );

  await walkTo(
    person,
    homes[person]
  );

  busy.delete(person);
}


/* One idle decision every 30–55 seconds */

function scheduleIdle(){

  const delay =
    30000 +
    Math.random()*25000;

  setTimeout(async()=>{

    const candidates = [
      "rico",
      "trent",
      "calvin",
      "draymond",
      "axel",
      "adam"
    ];

    const person =
      candidates[
        Math.floor(
          Math.random() *
          candidates.length
        )
      ];

    idleTrip(person);

    scheduleIdle();

  },delay);
}

scheduleIdle();


/* =========================================================
   DEMO TASK ROUTING

   This is currently the visual layer.

   Later /api/task can replace this logic with the REAL
   Manager/backend AI response.

   The UI animation should start independently of the real
   AI request — never hold up actual work waiting for a
   character to walk somewhere.
========================================================= */

const input =
  document.getElementById("taskInput");

const send =
  document.getElementById("sendButton");


function detectAgent(task){

  const t =
    task.toLowerCase();

  if(
    t.includes("design") ||
    t.includes("image") ||
    t.includes("visual") ||
    t.includes("logo") ||
    t.includes("ui")
  ){
    return "draymond";
  }

  if(
    t.includes("research") ||
    t.includes("find") ||
    t.includes("search") ||
    t.includes("compare")
  ){
    return "rico";
  }

  if(
    t.includes("code") ||
    t.includes("app") ||
    t.includes("website") ||
    t.includes("program")
  ){
    return "calvin";
  }

  if(
    t.includes("test") ||
    t.includes("bug") ||
    t.includes("check") ||
    t.includes("validate")
  ){
    return "trent";
  }

  if(
    t.includes("analyse") ||
    t.includes("analyze") ||
    t.includes("data") ||
    t.includes("numbers") ||
    t.includes("spreadsheet")
  ){
    return "axel";
  }

  if(
    t.includes("save") ||
    t.includes("organise") ||
    t.includes("organize") ||
    t.includes("archive")
  ){
    return "adam";
  }

  return "rico";
}


async function runVisualTask(task){

  const person =
    detectAgent(task);

  if(busy.has(person)){
    setStatus(
      capitalize(person) +
      " is already working"
    );
    return;
  }

  busy.add(person);

  setStatus(
    "Max assigned work to " +
    capitalize(person)
  );

  /*
    This short pause is ONLY visual.

    Once real AI is wired in, actual processing should
    already be running server-side.
  */

  await sleep(1000);

  setStatus(
    capitalize(person) +
    " is working"
  );

  /*
    Placeholder visual work period.
    Do NOT use this as the backend delay later.
  */

  await sleep(2800);

  setStatus(
    capitalize(person) +
    " finished"
  );

  await deliverToMax(person);

  busy.delete(person);
}


async function submitTask(){

  const task =
    input.value.trim();

  if(!task){
    return;
  }

  input.value = "";

  runVisualTask(task);
}




function capitalize(str){

  return (
    str.charAt(0).toUpperCase() +
    str.slice(1)
  );
}

  /* =======================================================
     CHARACTER LOCAL MOVEMENT

     Existing corridor/path system remains untouched.

     This makes characters feel more alive between proper
     trips. They shuffle around their work area occasionally
     and return to their actual path coordinates.

     Because margin is used rather than left/top, this does
     NOT corrupt the office pathfinding positions.
  ======================================================= */

  const people = [

    "max",
    "rico",
    "trent",
    "calvin",
    "draymond",
    "axel",
    "adam"

  ]
  .map(
    id =>
      document.getElementById(id)
  )
  .filter(Boolean);


  function localIdleMove(agent){

    if(
      !agent ||
      agent.classList.contains("walking")
    ){
      return;
    }

    /*
      small work-area movements:
      turn to another monitor,
      step towards shelf,
      move beside desk etc.
    */

    const choices = [

      [-8,0],
      [8,0],

      [-5,-5],
      [5,-5],

      [-7,4],
      [7,4],

      [0,-6],
      [0,5]

    ];

    const choice =
      choices[
        Math.floor(
          Math.random() *
          choices.length
        )
      ];

    agent.style.marginLeft =
      choice[0] + "px";

    agent.style.marginTop =
      choice[1] + "px";


    /*
      stay there for a moment,
      then return to normal position
    */

    setTimeout(()=>{

      if(
        !agent.classList.contains("walking")
      ){

        agent.style.marginLeft =
          "0px";

        agent.style.marginTop =
          "0px";

      }

    },
    2200 +
    Math.random()*2600);

  }


  /*
    More activity than before.

    Every 7–11 seconds one random person has a chance
    to make a little local movement.
  */

  function scheduleLocalMovement(){

    const delay =
      7000 +
      Math.random()*4000;

    setTimeout(()=>{

      if(
        people.length
      ){

        const person =
          people[
            Math.floor(
              Math.random() *
              people.length
            )
          ];

        /*
          high enough to notice,
          low enough to avoid everyone jittering
        */

        if(
          Math.random() < .72
        ){
          localIdleMove(person);
        }

      }

      scheduleLocalMovement();

    },delay);

  }

  scheduleLocalMovement();


  /* =======================================================
     JARED MOVES EVEN MORE

     We DON'T replace Jared's existing corridor patrol.
     This just gives him cleaning motion between patrols.
  ======================================================= */

    document.getElementById("jared");

    if(
      !jared ||
      jared.classList.contains("walking")
    ){
      return;
    }

    jared.style.marginLeft =
      "-5px";

    setTimeout(()=>{

        !jared.classList.contains("walking")

        jared.style.marginLeft =
          "5px";
      }

    },900);

    setTimeout(()=>{

      if(
        !jared.classList.contains("walking")
      ){

        jared.style.marginLeft =
          "0px";

      }

    },1800);

  }

  setInterval(
    jaredClean,
    9000
  );


  /* =======================================================
     KEEP MARGINS CLEAN WHEN AN AGENT STARTS WALKING
  ======================================================= */

  const movementObserver =
    new MutationObserver(
      mutations=>{

        mutations.forEach(
          mutation=>{

            const agent =
              mutation.target;

            if(
              agent.classList &&
              agent.classList.contains("walking")
            ){

              agent.style.marginLeft =
                "0px";

              agent.style.marginTop =
                "0px";

            }

          }
        );

      }
    );

  [
    ...people,
    jared
  ]
  .filter(Boolean)
  .forEach(agent=>{

    movementObserver.observe(
      agent,
      {
        attributes:true,
        attributeFilter:[
          "class"
        ]
      }
    );

  });

})();

      x:
        parseFloat(
          agent.style.left

      y:
        parseFloat(
          agent.style.top

    };

  }


  async function moveSegment(
    agent,
    point
  ){

    if(
      !agent ||
      !point
    ){
      return;
    }


    const current =
      currentPosition(agent);


    const dx =
      point.x - current.x;

    const dy =
      point.y - current.y;


    const distance =
      Math.sqrt(
                dx*dx +
        dy*dy
      );


    /*
      roughly 30px/sec.
      Deliberately not fast.
    */

    const duration =
      Math.max(

        distance / 30 * 1000

    agent.classList.add(

    agent.style.transition =
      `left ${duration}ms linear,
       top ${duration}ms linear`;


    agent.style.left =
      point.x + "px";

    agent.style.top =
      point.y + "px";


    await wait(duration);


    agent.classList.remove(
      "real-walking-v3"
    );
  }

<script>
const taskInput =
  document.querySelector('input[placeholder="Give Max a task..."]');

const sendButton =
  document.querySelector(".send");

let aiOfficeTaskRunning = false;

async function sendTaskToMax() {
  if (aiOfficeTaskRunning) return;

  const goal = taskInput?.value.trim();

  if (!goal) return;

  aiOfficeTaskRunning = true;

  const oldPlaceholder = taskInput.placeholder;
  taskInput.disabled = true;
  sendButton.disabled = true;
  taskInput.placeholder = "Max is working...";

  if (typeof setStatus === "function") {
    setStatus("Max is working...");
  }

  try {
    const response = await fetch("/api/task", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ goal })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data?.details?.error?.message ||
        data?.details?.message ||
        data?.error ||
        "Task failed"
      );
    }

    if (typeof setStatus === "function") {
      setStatus("Max completed the task");
    }

    showMaxResult(
  data.answer ||
  "Max finished, but no answer was returned."
);

    taskInput.value = "";

  } catch (error) {
    console.error("AI Office error:", error);

    if (typeof setStatus === "function") {
      setStatus("AI Office error");
    }

    alert("AI Office error: " + error.message);

  } finally {
    aiOfficeTaskRunning = false;
    taskInput.disabled = false;
    sendButton.disabled = false;
    taskInput.placeholder = oldPlaceholder;
    taskInput.focus();
  }
}

sendButton?.addEventListener(
  "click",
  sendTaskToMax
);

taskInput?.addEventListener(
  "keydown",
  (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      sendTaskToMax();
    }
  }
);
</script>

<script>
const maxNotification =
  document.getElementById("maxNotification");

const maxResultPanel =
  document.getElementById("maxResultPanel");

const maxResultContent =
  document.getElementById("maxResultContent");

const closeMaxResult =
  document.getElementById("closeMaxResult");

function showMaxResult(answer){

  maxResultContent.textContent =
    answer || "Task completed.";

  maxNotification.classList.add("visible");
}

maxNotification.addEventListener("click", () => {

  maxResultPanel.classList.add("visible");

  maxNotification.classList.remove("visible");
});

closeMaxResult.addEventListener("click", () => {

  maxResultPanel.classList.remove("visible");
});

maxResultPanel.addEventListener("click", (event) => {

  if(event.target === maxResultPanel){
    maxResultPanel.classList.remove("visible");
  }

});
</script>
